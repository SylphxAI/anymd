name: Candidate native build evidence

# Proves the native builds available on the current fleet. A matching host also
# executes the installed launcher, but cross-build success is never reported as
# runtime parity. Product Darwin remains Sylphx self-hosted only.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'crates/**'
      - 'packages/**'
      - 'src/runtime-entry.ts'
      - 'src/native/**'
      - 'scripts/check-registry-install-proof.ts'
      - 'scripts/check-public-runner-profiles.py'
      - 'scripts/stage-rust-mcp.ts'
      - 'docs/specs/host-runtime-proof-contract.md'
      - '.github/workflows/candidate-host-runtime-proof.yml'
      - '.github/workflows/registry-install-proof.yml'
      - '.github/workflows/publish-npm.yml'
      - '.github/workflows/native-package-scaffold.yml'
      - 'package.json'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          # Product policy: never GitHub-hosted runners. Darwin uses Sylphx self-hosted only.
          # linux-x64 host-proves on sylphx-linux-standard.
          # linux-arm64 + win32-x64-msvc: cross-built on linux-standard (no arm64/windows pool yet);
          # host-execute proof only when runner arch/OS matches (fail-closed).
          # Darwin pool offline — omit macos legs so CI cannot starve on queued forever jobs.
          # Residual: darwin host/cross proof deferred until sylphx macos runners online.
          matrix='[
            {"platformId":"linux-x64-gnu","runner":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},
            {"platformId":"linux-arm64-gnu","runner":"ubuntu-latest","target":"aarch64-unknown-linux-gnu"},
            {"platformId":"win32-x64-msvc","runner":"ubuntu-latest","target":"x86_64-pc-windows-msvc"}
          ]'
          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  proof:
    needs: map
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.map.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Node is the npm CLI / customer installer host, not the company TypeScript toolchain.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross toolchain for ${{ matrix.platformId }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platformId }}" in
            linux-arm64-gnu)
              sudo apt-get update -y
              sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
              ;;
            win32-x64-msvc)
              # Cross MSVC on Linux via cargo-xwin (no Windows self-hosted pool yet).
              sudo apt-get update -y
              sudo apt-get install -y --no-install-recommends clang lld llvm
              if ! command -v clang-cl >/dev/null 2>&1; then
                sudo ln -sf "$(command -v clang)" /usr/local/bin/clang-cl
              fi
              if ! command -v lld-link >/dev/null 2>&1; then
                sudo ln -sf "$(command -v lld)" /usr/local/bin/lld-link
              fi
              if ! command -v llvm-lib >/dev/null 2>&1 && command -v llvm-ar >/dev/null 2>&1; then
                sudo ln -sf "$(command -v llvm-ar)" /usr/local/bin/llvm-lib
              fi
              cargo install cargo-xwin --locked --version '=0.18.4'
              rustup component add rust-src
              ;;
          esac

      - name: Build + stage native for ${{ matrix.platformId }}
        shell: bash
        run: |
          set -euo pipefail
          echo "host=$(uname -s)-$(uname -m) nodeArch=$(node -p 'process.arch') required=${{ matrix.platformId }}"
          if [[ "${{ matrix.platformId }}" == "win32-x64-msvc" ]]; then
            cargo xwin build --release -p pdf-reader-mcp-server --target ${{ matrix.target }}
          else
            cargo build --release -p pdf-reader-mcp-server --target ${{ matrix.target }}
          fi
          if [[ "${{ matrix.platformId }}" == "win32-x64-msvc" ]]; then
            src="target/${{ matrix.target }}/release/anymd.exe"
          else
            src="target/${{ matrix.target }}/release/anymd"
          fi
          mkdir -p "bin/native/${{ matrix.platformId }}" "packages/anymd-${{ matrix.platformId }}/bin"
          cp "$src" "bin/native/${{ matrix.platformId }}/$(basename "$src")"
          cp "$src" "packages/anymd-${{ matrix.platformId }}/bin/$(basename "$src")"
          if [[ "${{ matrix.platformId }}" != "win32-x64-msvc" ]]; then
            chmod +x "bin/native/${{ matrix.platformId }}/$(basename "$src")" \
              "packages/anymd-${{ matrix.platformId }}/bin/$(basename "$src")"
          fi
          mkdir -p bin/native
          cp "$src" "bin/native/$(basename "$src")"
          if [[ "${{ matrix.platformId }}" != "win32-x64-msvc" ]]; then chmod +x "bin/native/$(basename "$src")"; fi

      - name: Build sole-Rust package launcher
        shell: bash
        run: bun run build:package

      - name: Record build evidence and matching-host launcher proof
        shell: bash
        env:
          PROOF_REQUIRE_PLATFORM_ID: ${{ matrix.platformId }}
        run: |
          set -euo pipefail
          required="${{ matrix.platformId }}"
          host_id="$(bun -e 'import { resolveNativePlatformId } from "./scripts/native/platform-package-map.ts"; const id=resolveNativePlatformId(); if(!id) process.exit(2); process.stdout.write(id)')"
          echo "host_id=${host_id} required=${required}"
          if [[ "${host_id}" == "${required}" ]]; then
            bun scripts/check-registry-install-proof.ts --local-pack | tee "candidate-evidence-${required}.json"
          else
            # Cross-build already staged above. Accept crossBuiltOnly for triples without matching
            # self-hosted pool (linux-arm64, win32, darwin-arm64-on-x64). Never use GH-hosted.
            case "${required}" in
              linux-arm64-gnu|win32-x64-msvc|darwin-arm64)
                ;;
              *)
                echo "::error::Host ${host_id} cannot provide host-runtime proof for ${required}."
                exit 1
                ;;
            esac
          python3 - <<'PY' "${required}" "${host_id}"
          import json, platform, subprocess, sys
          required = sys.argv[1]
          host_id = sys.argv[2]
          uname = subprocess.check_output(['uname','-m'], text=True).strip()
          report = {
            'profile': 'candidate_native_build_evidence_leg',
            'pass': True,
            'runtimeProofValid': False,
            'requiredPlatformId': required,
            'hostPlatformId': host_id,
            'host': {
              'nodePlatform': sys.platform,
              'nodeArch': platform.machine(),
              'unameMachine': uname,
            },
            'crossBuiltOnly': True,
            'note': f'Cross-built on host {host_id}; host runtime proof deferred until matching self-hosted capacity (no GitHub-hosted macos-*).',
          }
          path = f'candidate-evidence-{required}.json'
          open(path,'w').write(json.dumps(report, indent=2)+'\n')
          print(json.dumps(report, indent=2))
          PY
          fi
      - name: Upload candidate evidence JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-native-evidence-${{ matrix.platformId }}
          path: candidate-evidence-${{ matrix.platformId }}.json
          if-no-files-found: warn

  aggregate:
    needs: proof
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: proofs
          pattern: candidate-native-evidence-*
          merge-multiple: true

      - name: Aggregate build coverage and runtime facts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          files = sorted(pathlib.Path('proofs').glob('candidate-evidence-*.json'))
          legs = []
          proven = []
          failed = []
          cross_ok = []
          for f in files:
              data = json.loads(f.read_text())
              platform = data.get('requiredPlatformId') or data.get('hostPlatformId') or f.stem
              valid = bool(data.get('runtimeProofValid') and data.get('pass') and not data.get('crossBuiltOnly') and not data.get('deferred'))
              legs.append({
                  'file': f.name,
                  'platformId': platform,
                  'pass': data.get('pass'),
                  'runtimeProofValid': data.get('runtimeProofValid'),
                  'crossBuiltOnly': data.get('crossBuiltOnly'),
                  'deferred': data.get('deferred'),
                  'host': data.get('host'),
                  'initialize': data.get('initialize'),
              })
              if valid:
                  proven.append(platform)
              elif data.get('crossBuiltOnly') and data.get('pass'):
                  cross_ok.append(platform)
              else:
                  failed.append(platform)
          all_platforms = [
              'linux-x64-gnu',
              'linux-arm64-gnu',
              'darwin-x64',
              'darwin-arm64',
              'win32-x64-msvc',
          ]
          build_scope = ['linux-x64-gnu', 'linux-arm64-gnu', 'win32-x64-msvc']
          built = sorted(set(proven + cross_ok))
          missing_build_scope = [x for x in build_scope if x not in built]
          runtime_missing = [x for x in all_platforms if x not in proven]
          report = {
              'profile': 'candidate_native_build_evidence_aggregate',
              'allProductPlatforms': all_platforms,
              'buildCoverageScope': build_scope,
              'buildCovered': built,
              'unbuiltProductPlatforms': [x for x in all_platforms if x not in built],
              'distinctHostTriplesProven': sorted(set(proven)),
              'runtimeParityMissing': runtime_missing,
              'crossBuiltOnly': sorted(set(cross_ok)),
              'failedOrMissingInBuildScope': missing_build_scope + failed,
              'legs': legs,
              'buildCoveragePass': len(missing_build_scope) == 0 and len(failed) == 0,
              'runtimeParityPass': len(runtime_missing) == 0,
              'pass': len(missing_build_scope) == 0 and len(failed) == 0,
              'status': 'complete' if len(runtime_missing) == 0 else 'partial',
              'policy': 'green means the declared three-platform build scope succeeded; only runtimeParityPass=true means five-host parity',
          }
          pathlib.Path('candidate-native-build-evidence-aggregate.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          if not report['pass']:
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-native-build-evidence-aggregate
          path: candidate-native-build-evidence-aggregate.json
