name: Native package scaffold

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'packages/**'
      - 'scripts/native/**'
      - 'scripts/stage-rust-mcp.ts'
      - 'scripts/release-publish-with-natives.ts'
      - 'package.json'
      - 'scripts/smoke-native-launcher.ts'
      - 'scripts/smoke-native-package-resolve.ts'
      - 'bin/citra'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native-package-scaffold.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'packages/**'
      - 'scripts/native/**'
      - 'scripts/stage-rust-mcp.ts'
      - 'scripts/release-publish-with-natives.ts'
      - 'package.json'
      - 'scripts/smoke-native-launcher.ts'
      - 'scripts/smoke-native-package-resolve.ts'
      - 'bin/citra'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/native-package-scaffold.yml'

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - id: set
        run: |
          # Product CI: all platforms Sylphx self-hosted only (no GitHub-hosted runners).
          # linux-arm64/win32 cross-built on sylphx-linux-standard with toolchains.
          # Darwin self-hosted pool is currently offline (2026-08-04 inventory).
          # Do not enqueue darwin legs that starve forever; restore when macos pool is online.
          # Residual: no darwin native binary proof in this workflow until capacity returns.
          matrix='[{"platformId":"linux-x64-gnu","runner":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},{"platformId":"linux-arm64-gnu","runner":"ubuntu-latest","target":"aarch64-unknown-linux-gnu"},{"platformId":"win32-x64-msvc","runner":"ubuntu-latest","target":"x86_64-pc-windows-msvc"}]'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Verify package map and Stage B publishable posture
        run: |
          bun test test/native-platform-package-map.test.ts
          # dropInFor3014 may be true after sole-runtime authorization; still require publishable natives.
          jq -e '.productTruth.dropInFor3014 == true or .productTruth.dropInFor3014 == false' docs/specs/pure-rust-capability-matrix.json >/dev/null
          bun run native:sync-manifests
          bun run native:assert-ready -- --manifests-only --all
          # Packages are publishable (not private) but still not sole-runtime defaults.
          for pkg in packages/citra-*/package.json; do
            jq -e '(.private != true) and (.citraNativeBinary != null)' "$pkg" >/dev/null
          done

  build:
    needs: map
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.map.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross toolchain for ${{ matrix.platformId }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platformId }}" in
            linux-arm64-gnu)
              sudo apt-get update -y
              sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
              ;;
            win32-x64-msvc)
              sudo apt-get update -y
              sudo apt-get install -y --no-install-recommends clang lld llvm
              # cargo-xwin + ring need clang-cl / lld-link entrypoints on Linux.
              if ! command -v clang-cl >/dev/null 2>&1; then
                sudo ln -sf "$(command -v clang)" /usr/local/bin/clang-cl
              fi
              if ! command -v lld-link >/dev/null 2>&1; then
                sudo ln -sf "$(command -v lld)" /usr/local/bin/lld-link
              fi
              if ! command -v llvm-lib >/dev/null 2>&1 && command -v llvm-ar >/dev/null 2>&1; then
                sudo ln -sf "$(command -v llvm-ar)" /usr/local/bin/llvm-lib
              fi
          cargo install cargo-xwin --locked --version '=0.18.4'
              rustup component add rust-src || true
              ;;
          esac

      - name: Build release server for ${{ matrix.platformId }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platformId }}" == "win32-x64-msvc" ]]; then
            cargo xwin build --release -p pdf-reader-mcp-server --target ${{ matrix.target }}
          else
            cargo build --release -p pdf-reader-mcp-server --target ${{ matrix.target }}
          fi
          if [[ "${{ matrix.platformId }}" == "win32-x64-msvc" ]]; then
            src="target/${{ matrix.target }}/release/citra-mcp-server.exe"
            dest="bin/native/${{ matrix.platformId }}/citra-mcp-server.exe"
          else
            src="target/${{ matrix.target }}/release/citra-mcp-server"
            dest="bin/native/${{ matrix.platformId }}/citra-mcp-server"
          fi
          mkdir -p "$(dirname "$dest")"
          cp "$src" "$dest"
          if [[ "${{ matrix.platformId }}" != "win32-x64-msvc" ]]; then
            chmod +x "$dest"
          fi
          ls -la "$dest"
      - name: Upload staged native binary
        uses: actions/upload-artifact@v7
        with:
          name: citra-mcp-server-${{ matrix.platformId }}
          path: bin/native/${{ matrix.platformId }}/**
          if-no-files-found: error
      - name: Stage package/legacy paths and host runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ matrix.platformId }}"
          if [[ "$platform" == "win32-x64-msvc" ]]; then
            bin_name="citra-mcp-server.exe"
          else
            bin_name="citra-mcp-server"
          fi
          staged="bin/native/${platform}/${bin_name}"
          test -f "$staged"
          mkdir -p "packages/citra-${platform}/bin" "bin/native"
          cp "$staged" "packages/citra-${platform}/bin/${bin_name}"
          cp "$staged" "bin/native/${bin_name}"
          if [[ "$platform" != "win32-x64-msvc" ]]; then
            chmod +x "$staged" "packages/citra-${platform}/bin/${bin_name}" "bin/native/${bin_name}"
          fi
          # Host execute smoke is only valid when the matrix target matches the runner triple.
          # Sylphx self-hosted macOS is currently QEMU amd64 (darwin-x64); aarch64-apple-darwin is
          # still built/asserted here via cross-compile, but must not be executed on the x64 host.
          host_platform="$(bun -e 'import { resolveNativePlatformId } from "./scripts/native/platform-package-map.ts"; const id=resolveNativePlatformId(); if(!id) process.exit(2); process.stdout.write(id)')"
          if [[ "$host_platform" == "$platform" ]]; then
            bun run smoke:native-launcher
            bun run smoke:native-package-resolve
          else
            echo "Skipping host execute smoke for cross-target ${platform} on host ${host_platform}"
          fi
          bun scripts/native/assert-native-packages-ready.ts --platform=${{ matrix.platformId }}
