name: CI

on:
  merge_group:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least privilege for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  review-stamp:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: SylphxAI/.github/.github/actions/review-stamp-gate@0f4a21fe893880d1443630c6632104140f16a932
        with:
          config-path: .github/review-stamp.json
          trusted-creator-ids: '8020099'

  plain-language:
    name: Plain language
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check added lines for plain language
        uses: SylphxAI/.github/.github/actions/plain-language@f9176dad2e49c6b99d75f1506fafac84632fe870

  identifiers:
    name: Identifiers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Non-v7 ids on added lines (owner standards/identifiers.md)
        uses: SylphxAI/.github/.github/actions/identifiers@e4a5ea41cbcc87cd93914f89f0d7c3981c868bf9

  validate:
    name: Validate Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Merge-group review gate contract
        run: python3 -m unittest discover -s scripts -p test_review_gate.py

      - name: Validate GitHub Actions workflows
        run: bash scripts/check-github-actions.sh

      - name: Brand home matches its masters
        uses: SylphxAI/.github/.github/actions/brand@a6c81b4bcda66bf624f0a68e25e63b3c0ed043eb # shared brand generator

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: |
          # Dependabot doesn't update bun.lock, so we can't use --frozen-lockfile for its PRs
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            bun install
          else
            bun install --frozen-lockfile
          fi

      - name: Check Code Quality (Biome)
        run: bun run check

      - name: Public copy matches product.json and benchmark results
        run: bun run check:copy

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Python API and wheel packaging without framework dependencies
        run: |
          python3 -m unittest discover -s packages/pypi/tests -v
          python3 -m unittest discover -s bench/navigation -p 'test_*.py' -v

      - name: Test release recovery and vendored crate version checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Every manifest carries the same version
        run: bun run check:versions

      - name: Public repository runs on GitHub-hosted runners only
        run: bun run check:runner-profiles

      - name: Typecheck
        run: bun run typecheck

      - name: ASR scoring regression tests
        run: |
          python3 -m venv "$RUNNER_TEMP/asr-scoring"
          "$RUNNER_TEMP/asr-scoring/bin/pip" install jiwer==4.0.0 opencc-python-reimplemented==0.1.7 cn2an==0.5.24 kanjize==1.6.1
          "$RUNNER_TEMP/asr-scoring/bin/python" -m unittest discover -s bench-asr -p test_report.py

      - name: Audit Rust dependencies
        run: bash scripts/check-cargo-advisories.sh

      # Packages every publishable crate the way `cargo publish` does (builds each
      # from its packed sources against the others), then keeps each under the
      # crates.io limit of 10 MB.
      - name: Package the crates for crates.io
        run: |
          cargo package --locked -p anymd-adobe-cmap-parser -p anymd-pdf-extract -p anymd-pdf -p anymd-formats -p anymd-core -p anymd
          bash scripts/publish-crates.sh --list
          oversized=$(find target/package -name '*.crate' -size +9M)
          if [ -n "$oversized" ]; then echo "over 9 MB: $oversized" >&2; exit 1; fi
          ls -l target/package/*.crate

      - name: Build the anymd binary
        run: bun run build

      - name: Verify portable ASR CPU configuration
        run: python3 scripts/check-native-cpu.py target/release/build

      - name: Test installed Python wheel and optional framework adapters
        run: |
          python3 scripts/build-wheels.py --version 0.0.0 --out "${RUNNER_TEMP}/python-wheels" \
            --binary "manylinux_2_17_x86_64=target/release/anymd"
          python3 -m venv "${RUNNER_TEMP}/anymd-python"
          "${RUNNER_TEMP}/anymd-python/bin/pip" install \
            "${RUNNER_TEMP}/python-wheels/anymd-0.0.0-py3-none-manylinux_2_17_x86_64.whl[langchain,llamaindex]"
          "${RUNNER_TEMP}/anymd-python/bin/python" -c \
            'from anymd import convert; assert "<!-- page 1 -->" in convert("test/fixtures/sample.pdf").text'
          ANYMD_BIN="$PWD/target/release/anymd" "${RUNNER_TEMP}/anymd-python/bin/python" \
            -m unittest discover -s packages/pypi/tests -v

      - name: Fetch Markdown regression corpus
        run: bash scripts/fetch-markdown-corpus.sh "${RUNNER_TEMP}/markdown-corpus"

      - name: Rust core tests
        env:
          ANYMD_CORPUS_DIR: ${{ runner.temp }}/markdown-corpus
        run: bun run test:rust

      # The docs playground runs anymd-pdf + anymd-formats in the browser; keep
      # them free of native-only dependencies. (docs:build below degrades to a
      # "not in this build" notice when the .wasm is absent.)
      - name: Check WebAssembly build
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p anymd-wasm --target wasm32-unknown-unknown

      - name: Run Tests and Check Coverage
        run: bun run test:cov

      - name: Build docs
        run: bun run docs:build

      - name: Upload coverage reports
        if: ${{ github.event_name != 'merge_group' && !cancelled() && hashFiles('coverage/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 3

  # Queue-only: macOS and Windows run when a pull request enters the merge
  # queue, so they gate the merge without doubling the pull request load. GitHub-hosted
  # standard runners are free for public repositories (owner standards/dx.md).
  other-os:
    if: github.event_name == 'merge_group'
    name: Test other OS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust workspace tests
        run: cargo test --locked --workspace --no-fail-fast

      - name: Build the anymd binary
        run: cargo build --release --locked -p anymd

      # The npm launcher (packages/anymd/bin/anymd.js) starts the native binary.
      - name: Launcher smoke test
        shell: bash
        run: |
          set -euo pipefail
          node packages/anymd/bin/anymd.js version
          node packages/anymd/bin/anymd.js test/fixtures/sample.pdf > sample.md
          grep -q '<!-- page 1 -->' sample.md

  security-secrets:
    name: security:secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the new-commit range
      - name: Secret scan (ADR-6 security:secrets)
        uses: SylphxAI/.github/.github/actions/secret-scan@main

  # Validate builds Linux x64. Compile the actual product (not only the runtime
  # probe) on the other release targets, without downloading model weights.
  release-targets:
    name: Release build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-latest, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked -p anymd --target ${{ matrix.target }}
      - name: Verify portable ASR CPU configuration
        run: python3 scripts/check-native-cpu.py target/${{ matrix.target }}/release/build

  ci-ok:
    name: ci-ok
    if: always()
    needs: [plain-language, identifiers, validate, other-os, security-secrets, release-targets, review-stamp]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | all(.[]; .value.result == "success" or ((.key == "other-os" or .key == "review-stamp") and .value.result == "skipped"))'
