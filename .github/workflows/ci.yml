# Merge-queue gate (docs/optimistic-merge.md): fast lanes only; the heavy suite is verify.yml.
name: CI

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, edited]

# Least privilege for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  # Supersede obsolete runs of a pull request only; merge queue and manual runs always finish.
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Stop the line while the trunk's newest Verify run is red and its way back is in
  # motion (docs/optimistic-merge.md). Merge groups only; ships in observe mode.
  main-state:
    if: ${{ github.repository_visibility == 'public' && (github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/main-red-gate@f27e4105e2da7d681ecebe946634bdda7ba553ba # main
        with:
          mode: observe

  plain-language:
    name: Plain language
    if: ${{ github.repository_visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check added lines for plain language
        uses: SylphxAI/.github/.github/actions/plain-language@f27e4105e2da7d681ecebe946634bdda7ba553ba # main

  identifiers:
    name: Identifiers
    if: ${{ github.repository_visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Non-v7 ids on added lines (owner standards/identifiers.md)
        uses: SylphxAI/.github/.github/actions/identifiers@f27e4105e2da7d681ecebe946634bdda7ba553ba # main

  chat-senders:
    name: Chat senders
    if: ${{ github.repository_visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Added lines send chat through Notify
        uses: SylphxAI/.github/.github/actions/chat-senders@f27e4105e2da7d681ecebe946634bdda7ba553ba # main
        with:
          mode: fail

  # Pull requests that only touch these files skip the heavy jobs; the required
  # checks (ci-ok and every job name) still report. docs/** is not listed
  # because CI builds the docs.
  changes:
    name: Changes
    if: ${{ github.repository_visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.result.outputs.code }}
      navigation: ${{ steps.nav.outputs.navigation || 'false' }}
    steps:
      - name: Changed files that need the full CI
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!LICENSE'
              - '!CHANGELOG.md'
              - '!CONTRIBUTING.md'
              - '!SECURITY.md'
              - '!.github/ISSUE_TEMPLATE/**'

      - name: Changed files that need navigation parity
        id: nav
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            navigation:
              - 'crates/anymd/src/outline.rs'
              - 'test/production/outline.contract.test.ts'
              - 'scripts/check-navigation-regression.py'
              - '.github/workflows/navigation.yml'

      # Merge queue, manual and every other event always run everything.
      - name: Decide
        id: result
        env:
          FILTERED: ${{ steps.filter.outputs.code }}
        run: echo "code=${FILTERED:-true}" >> "$GITHUB_OUTPUT"

  # Fast checks: none of these compile the Rust workspace.
  validate:
    name: Validate Code Quality
    needs: changes
    if: ${{ github.repository_visibility == 'public' && (needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate GitHub Actions workflows
        uses: SylphxAI/.github/.github/actions/workflow-lint@f27e4105e2da7d681ecebe946634bdda7ba553ba # main
        with:
          contract-mode: enforce

      - name: Brand home matches its masters
        uses: SylphxAI/.github/.github/actions/brand@f27e4105e2da7d681ecebe946634bdda7ba553ba # main

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: |
          # Dependabot doesn't update bun.lock, so we can't use --frozen-lockfile for its PRs
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            bun install
          else
            bun install --frozen-lockfile
          fi

      - name: Check Code Quality (Biome)
        run: bun run check

      - name: Public copy matches product.json and benchmark results
        run: bun run check:copy

      - name: Test Python API, benchmark harness, and wheel packaging without framework dependencies
        run: |
          python3 -m unittest discover -s packages/pypi/tests -v
          python3 -m unittest discover -s bench/navigation -p 'test_*.py' -v
          python3 -m unittest discover -s bench -p 'test_*.py' -v

      - name: Test release recovery, Money contracts, and vendored crate checks
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/money-access-verify.test.py
          bun test scripts/money-catalogue-apply.test.ts

      - name: Every manifest carries the same version
        run: bun run check:versions

      - name: Public repository runs on GitHub-hosted runners only
        run: bun run check:runner-profiles

      - name: Typecheck
        run: bun run typecheck

      - name: ASR scoring regression tests
        run: |
          python3 -m venv "$RUNNER_TEMP/asr-scoring"
          "$RUNNER_TEMP/asr-scoring/bin/pip" install jiwer==4.0.0 opencc-python-reimplemented==0.1.7 cn2an==0.5.24 kanjize==1.6.1
          "$RUNNER_TEMP/asr-scoring/bin/python" -m unittest discover -s bench-asr -p test_report.py

  conversion-limits:
    name: Conversion limits
    needs: changes
    if: ${{ github.repository_visibility == 'public' && (needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: conversion-limits
      - name: Check bounded conversion and chapter controls
        run: |
          cargo test --locked -p anymd-formats --no-default-features --test office_samples -- --nocapture
          cargo test --locked -p anymd-formats --no-default-features --test text_encoding public_
          cargo test --locked -p anymd-formats --no-default-features --lib archive_validation::
          for module in limits ooxml epub pptx docx html csv xlsx; do
            cargo test --locked -p anymd-formats --no-default-features --lib "$module::tests"
          done
      - name: Measure the production conversion ceiling
        run: |
          cargo test --locked -p anymd-formats --no-default-features --lib --no-run --message-format=json > /tmp/conversion-tests.json
          binary=$(python3 -c 'import json; print(next(x["executable"] for line in open("/tmp/conversion-tests.json") if (x := json.loads(line)).get("executable") and x.get("profile", {}).get("test")))')
          /usr/bin/time -v "$binary" epub::tests::production_cumulative_output_limit --exact --ignored --nocapture
      - name: Check production library compilation
        run: cargo check --locked -p anymd-formats --no-default-features

  security-secrets:
    name: security:secrets
    if: ${{ github.repository_visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0 # full history for the new-commit range
      - name: Secret scan (ADR-6 security:secrets)
        uses: SylphxAI/.github/.github/actions/secret-scan@f27e4105e2da7d681ecebe946634bdda7ba553ba # main
        with:
          config-path: .gitleaks.toml

  plugin-scan:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/plugin-scan.yml

  navigation:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.navigation == 'true'
    uses: ./.github/workflows/navigation.yml

  # The full suite on a pull request that is ready; never in a merge group or a draft.
  suite:
    needs: changes
    if: github.event_name != 'merge_group' && !github.event.pull_request.draft
    uses: ./.github/workflows/verify.yml
    with:
      code: ${{ needs.changes.outputs.code }}
    secrets: inherit

  # No new departure from the default stack (docs/stack-conformance.md in
  # SylphxAI/.github): a backend service off Rust or a migration engine other
  # than atlas fails unless .github/stack-departures.txt, which may only
  # shrink, already lists it. Reads git objects only; a few seconds.
  stack:
    if: ${{ github.repository_visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          filter: blob:none
      - uses: SylphxAI/.github/.github/actions/stack-conformance@f27e4105e2da7d681ecebe946634bdda7ba553ba # main
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}

  ci-ok:
    name: ci-ok
    if: ${{ github.repository_visibility == 'public' && (always() && !cancelled()) }}
    needs: [main-state, changes, plain-language, identifiers, chat-senders, validate, security-secrets, conversion-limits, plugin-scan, navigation, suite, stack]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/needs-pass@f27e4105e2da7d681ecebe946634bdda7ba553ba # main
        with:
          needs: ${{ toJSON(needs) }}
          required: changes,stack
          required-unless-merge-group: ${{ github.event.pull_request.draft && ' ' || 'suite' }}
