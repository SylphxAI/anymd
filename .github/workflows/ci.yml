name: CI

on:
  workflow_dispatch:
  merge_group:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least privilege for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

concurrency:
  # Fast Trunk: supersede obsolete runs of a pull request only; merge queue
  # and manual runs always finish.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plain-language:
    name: Plain language
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check added lines for plain language
        uses: SylphxAI/.github/.github/actions/plain-language@f9176dad2e49c6b99d75f1506fafac84632fe870

  identifiers:
    name: Identifiers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Non-v7 ids on added lines (owner standards/identifiers.md)
        uses: SylphxAI/.github/.github/actions/identifiers@e4a5ea41cbcc87cd93914f89f0d7c3981c868bf9

  # Pull requests that only touch these files skip the heavy jobs; the required
  # checks (ci-ok and every job name) still report. docs/** is not listed
  # because CI builds the docs.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.result.outputs.code }}
    steps:
      - name: Changed files that need the full CI
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!LICENSE'
              - '!CHANGELOG.md'
              - '!CONTRIBUTING.md'
              - '!SECURITY.md'
              - '!.github/ISSUE_TEMPLATE/**'

      # Merge queue, manual and every other event always run everything.
      - name: Decide
        id: result
        env:
          FILTERED: ${{ steps.filter.outputs.code }}
        run: echo "code=${FILTERED:-true}" >> "$GITHUB_OUTPUT"

  # Fast checks: none of these compile the Rust workspace.
  validate:
    name: Validate Code Quality
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate GitHub Actions workflows
        run: bash scripts/check-github-actions.sh

      - name: Brand home matches its masters
        uses: SylphxAI/.github/.github/actions/brand@a6c81b4bcda66bf624f0a68e25e63b3c0ed043eb # shared brand generator

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: |
          # Dependabot doesn't update bun.lock, so we can't use --frozen-lockfile for its PRs
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            bun install
          else
            bun install --frozen-lockfile
          fi

      - name: Check Code Quality (Biome)
        run: bun run check

      - name: Public copy matches product.json and benchmark results
        run: bun run check:copy

      - name: Test Python API and wheel packaging without framework dependencies
        run: |
          python3 -m unittest discover -s packages/pypi/tests -v
          python3 -m unittest discover -s bench/navigation -p 'test_*.py' -v

      - name: Test release recovery and vendored crate version checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Every manifest carries the same version
        run: bun run check:versions

      - name: Public repository runs on GitHub-hosted runners only
        run: bun run check:runner-profiles

      - name: Typecheck
        run: bun run typecheck

      - name: ASR scoring regression tests
        run: |
          python3 -m venv "$RUNNER_TEMP/asr-scoring"
          "$RUNNER_TEMP/asr-scoring/bin/pip" install jiwer==4.0.0 opencc-python-reimplemented==0.1.7 cn2an==0.5.24 kanjize==1.6.1
          "$RUNNER_TEMP/asr-scoring/bin/python" -m unittest discover -s bench-asr -p test_report.py

  docs:
    name: Build docs
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            bun install
          else
            bun install --frozen-lockfile
          fi

      - name: Build docs
        run: bun run docs:build

  audit:
    name: Audit Rust dependencies
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # scripts/check-cargo-advisories.sh installs cargo-audit from source
      # when it is missing; keep the binary between runs.
      - name: Cache cargo-audit
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}

      - name: Audit Rust dependencies
        run: bash scripts/check-cargo-advisories.sh

  # The Rust workspace: package, build, fixtures, tests and coverage.
  rust:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            bun install
          else
            bun install --frozen-lockfile
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # Packages every publishable crate the way `cargo publish` does (builds each
      # from its packed sources against the others), then keeps each under the
      # crates.io limit of 10 MB.
      - name: Package the crates for crates.io
        run: |
          cargo package --locked -p anymd-oar-ocr-vl -p anymd-adobe-cmap-parser -p anymd-pdf-extract -p anymd-pdf -p anymd-formats -p anymd-core -p anymd-ocr-vlm -p anymd
          bash scripts/publish-crates.sh --list
          oversized=$(find target/package -name '*.crate' -size +9M)
          if [ -n "$oversized" ]; then echo "over 9 MB: $oversized" >&2; exit 1; fi
          ls -l target/package/*.crate

      - name: Build the anymd binary
        run: bun run build

      - name: Hosted real video core and MCP API fixtures
        env:
          ANYMD_BIN: ${{ github.workspace }}/target/release/anymd
          # A real anymd Pro licence for CI (issued for ci@sylphx.com); the fixture
          # also proves the release binary refuses Pro calls without one.
          ANYMD_PRO_TOKEN_CI: ${{ secrets.ANYMD_PRO_TOKEN_CI }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          cargo test --locked -p anymd-formats --test video_timeline -- --ignored
          python3 scripts/video_api_fixture.py

      - name: Verify portable ASR CPU configuration
        run: python3 scripts/check-native-cpu.py target/release/build

      - name: Test installed Python wheel and optional framework adapters
        run: |
          python3 scripts/build-wheels.py --version 0.0.0 --out "${RUNNER_TEMP}/python-wheels" \
            --binary "manylinux_2_17_x86_64=target/release/anymd"
          python3 -m venv "${RUNNER_TEMP}/anymd-python"
          "${RUNNER_TEMP}/anymd-python/bin/pip" install \
            "${RUNNER_TEMP}/python-wheels/anymd-0.0.0-py3-none-manylinux_2_17_x86_64.whl[langchain,llamaindex]"
          "${RUNNER_TEMP}/anymd-python/bin/python" -c \
            'from anymd import convert; assert "<!-- page 1 -->" in convert("test/fixtures/sample.pdf").text'
          ANYMD_BIN="$PWD/target/release/anymd" "${RUNNER_TEMP}/anymd-python/bin/python" \
            -m unittest discover -s packages/pypi/tests -v

      - name: Fetch Markdown regression corpus
        run: bash scripts/fetch-markdown-corpus.sh "${RUNNER_TEMP}/markdown-corpus"

      - name: Rust core tests
        env:
          ANYMD_CORPUS_DIR: ${{ runner.temp }}/markdown-corpus
        run: bun run test:rust

      # The docs playground runs anymd-pdf + anymd-formats in the browser; keep
      # them free of native-only dependencies. (docs:build below degrades to a
      # "not in this build" notice when the .wasm is absent.)
      - name: Check WebAssembly build
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p anymd-wasm --target wasm32-unknown-unknown

      - name: Run Tests and Check Coverage
        env:
          ANYMD_PRO_TOKEN: ${{ secrets.ANYMD_PRO_TOKEN_CI }}
        run: bun run test:cov

      - name: Upload coverage reports
        if: ${{ github.event_name != 'merge_group' && !cancelled() && hashFiles('coverage/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 3

  # Post-merge verify: macOS and Windows run on the main push, not in the merge
  # queue. GitHub-hosted macOS/Windows capacity can stay queued for hours and
  # stall every merge behind it, so the queue gate uses Linux runners only (fast
  # gate on the queue, full suite after merge: owner standards/dx.md). GitHub-hosted
  # standard runners are free for public repositories.
  other-os:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Test other OS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Rust workspace tests
        run: cargo test --locked --workspace --no-fail-fast

      - name: Build the anymd binary
        run: cargo build --release --locked -p anymd

      # The npm launcher (packages/anymd/bin/anymd.js) starts the native binary.
      - name: Launcher smoke test
        shell: bash
        run: |
          set -euo pipefail
          node packages/anymd/bin/anymd.js version
          node packages/anymd/bin/anymd.js test/fixtures/sample.pdf > sample.md
          grep -q '<!-- page 1 -->' sample.md

  security-secrets:
    name: security:secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the new-commit range
      - name: Secret scan (ADR-6 security:secrets)
        uses: SylphxAI/.github/.github/actions/secret-scan@main

  # Validate builds Linux x64. Compile the actual product (not only the runtime
  # probe) on the other release targets, without downloading model weights.
  release-targets:
    name: Release build (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked -p anymd --target ${{ matrix.target }}
      - name: Verify portable ASR CPU configuration
        run: python3 scripts/check-native-cpu.py target/${{ matrix.target }}/release/build

  # macOS and Windows release builds: pull requests and the main push, never the
  # merge queue (see other-os above).
  release-targets-hosted:
    name: Release build (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'merge_group'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-latest, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked -p anymd --target ${{ matrix.target }}
      - name: Verify portable ASR CPU configuration
        run: python3 scripts/check-native-cpu.py target/${{ matrix.target }}/release/build

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, plain-language, identifiers, validate, docs, audit, rust, other-os, security-secrets, release-targets, release-targets-hosted]
    runs-on: ubuntu-latest
    steps:
      # Heavy jobs are skipped only for pull requests that touch no code; other-os runs only after merge; the macOS/Windows release builds skip in the queue.
      - name: Require every applicable gate
        env:
          RESULTS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "$RESULTS" | jq -e --arg code "$CODE" '
            def heavy: ["validate","docs","audit","rust","release-targets","release-targets-hosted"];
            to_entries | all(.[];
              .value.result == "success"
              or ((.key == "other-os" or .key == "release-targets-hosted") and .value.result == "skipped")
              or (.key as $k | .value.result as $r | (heavy | index($k)) != null and $code == "false" and $r == "skipped"))'
