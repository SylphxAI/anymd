          ANNOTATION_HIGHLIGHT_QUADPOINTS_RESIDUAL_ARTIFACT="${SCRATCH_DIR}/v3014-annotation-highlight-quadpoints-residual-result.json"
          if [ ! -f "$ANNOTATION_HIGHLIGHT_QUADPOINTS_RESIDUAL_ARTIFACT" ]; then
            echo "::error::v3.0.14 annotation highlight quadpoints residual result missing at $ANNOTATION_HIGHLIGHT_QUADPOINTS_RESIDUAL_ARTIFACT"
            exit 1
          fi
          jq -e --arg sha "$CANDIDATE_SHA" '
            .profile == "pdf_reader_v3014_annotation_highlight_quadpoints_residual_result" and
            .candidateSha == $sha and .pass == true and
            .caseCount == 3 and .passed == 3 and .skipped == 0 and
            .mutationSensitive.leafMutationCount == 39 and
            .providerProof.highlightQuadNoApUsesQuadpoints == true and
            .providerProof.highlightApNoExtUsesQuadpoints == true and
            .providerProof.highlightApExtKeepsRawRect == true and
            .capabilityStatus.includeAnnotations == "PARTIAL" and
            .productTruth.dropInFor3014 == false
          ' "$ANNOTATION_HIGHLIGHT_QUADPOINTS_RESIDUAL_ARTIFACT" >/dev/null || {
            echo "::error::v3.0.14 annotation highlight quadpoints residual result is incomplete, failing, or not SHA-bound"
            exit 1
          }


          ANNOTATION_TEXT_MARKUP_QUADPOINTS_RESIDUAL_ARTIFACT="${SCRATCH_DIR}/v3014-annotation-text-markup-quadpoints-residual-result.json"
          if [ ! -f "$ANNOTATION_TEXT_MARKUP_QUADPOINTS_RESIDUAL_ARTIFACT" ]; then
            echo "::error::v3.0.14 annotation text-markup quadpoints residual result missing at $ANNOTATION_TEXT_MARKUP_QUADPOINTS_RESIDUAL_ARTIFACT"
            exit 1
          fi
          jq -e --arg sha "$CANDIDATE_SHA" '
            .profile == "pdf_reader_v3014_annotation_text_markup_quadpoints_residual_result" and
            .candidateSha == $sha and .pass == true and
            .caseCount == 3 and .passed == 3 and .skipped == 0 and
            .mutationSensitive.leafMutationCount == 39 and
            .providerProof.underlineQuadNoApUsesQuadpoints == true and
            .providerProof.squigglyQuadNoApUsesStripBbox == true and
            .providerProof.strikeoutQuadNoApUsesQuadpoints == true and
            .capabilityStatus.includeAnnotations == "PARTIAL" and
            .productTruth.dropInFor3014 == false
          ' "$ANNOTATION_TEXT_MARKUP_QUADPOINTS_RESIDUAL_ARTIFACT" >/dev/null || {
            echo "::error::v3.0.14 annotation text-markup quadpoints residual result is incomplete, failing, or not SHA-bound"
            exit 1
          }


          ANNOTATION_TEXT_MARKUP_WITH_AP_RESIDUAL_ARTIFACT="${SCRATCH_DIR}/v3014-annotation-text-markup-with-ap-residual-result.json"
          if [ ! -f "$ANNOTATION_TEXT_MARKUP_WITH_AP_RESIDUAL_ARTIFACT" ]; then
            echo "::error::v3.0.14 annotation text-markup with-appearance residual result missing at $ANNOTATION_TEXT_MARKUP_WITH_AP_RESIDUAL_ARTIFACT"
            exit 1
          fi
          jq -e --arg sha "$CANDIDATE_SHA" '
            .profile == "pdf_reader_v3014_annotation_text_markup_with_ap_residual_result" and
            .candidateSha == $sha and .pass == true and
            .caseCount == 3 and .passed == 3 and .skipped == 0 and
            .mutationSensitive.leafMutationCount == 39 and
            .providerProof.underlineApKeepsRawRect == true and
            .providerProof.squigglyApKeepsRawRect == true and
            .providerProof.strikeoutApKeepsRawRect == true and
            .capabilityStatus.includeAnnotations == "PARTIAL" and
            .productTruth.dropInFor3014 == false
          ' "$ANNOTATION_TEXT_MARKUP_WITH_AP_RESIDUAL_ARTIFACT" >/dev/null || {
            echo "::error::v3.0.14 annotation text-markup with-appearance residual result is incomplete, failing, or not SHA-bound"
            exit 1
          }

          VISUAL_ARTIFACT="${SCRATCH_DIR}/v3014-visual-result.json"
          if [ ! -f "$VISUAL_ARTIFACT" ]; then
            echo "::error::v3.0.14 visual result missing at $VISUAL_ARTIFACT"
            exit 1
          fi


          jq -e --arg sha "$CANDIDATE_SHA" '
            .profile == "pdf_reader_v3014_visual_result" and
            .candidateSha == $sha and .pass == true and
            .caseCount == 16 and .passed == 16 and .skipped == 0
          ' "$VISUAL_ARTIFACT" >/dev/null || {
            echo "::error::v3.0.14 visual result is incomplete, failing, or not SHA-bound"
            exit 1
          }
          echo "proof SHA binding OK: lastComparedMainSha=$LAST_COMPARED"

      - name: Warn on stale capabilities without re-proof
        if: needs.map-and-stale.outputs.stale_capabilities != '[]'
        run: |
          echo "::warning::Stale capabilities detected — claimed-subset checks must pass before merge"
          echo "${{ needs.map-and-stale.outputs.stale_capabilities }}"

      - name: Upload verification artifact
        uses: actions/upload-artifact@v7
        with:
          name: pdf-reader-mcp-differential-${{ env.CANDIDATE_SHA }}
          path: |
            ${{ env.SCRATCH_DIR }}/verification.json
            ${{ env.SCRATCH_DIR }}/differential.log
            ${{ env.SCRATCH_DIR }}/oracle.json
            ${{ env.SCRATCH_DIR }}/ts-vs-rust-text.json
            ${{ env.SCRATCH_DIR }}/v3014-behavior-result.json
            ${{ env.SCRATCH_DIR }}/v3014-text-layer-result.json
            ${{ env.SCRATCH_DIR }}/v3014-citation-chunk-result.json
            ${{ env.SCRATCH_DIR }}/v3014-semantic-hint-result.json
            ${{ env.SCRATCH_DIR }}/v3014-document-ast-result.json
            ${{ env.SCRATCH_DIR }}/v3014-document-map-result.json
            ${{ env.SCRATCH_DIR }}/v3014-trust-report-result.json
            ${{ env.SCRATCH_DIR }}/v3014-selectable-table-result.json
            ${{ env.SCRATCH_DIR }}/v3014-caption-link-result.json
            ${{ env.SCRATCH_DIR }}/v3014-search-semantic-result.json
            ${{ env.SCRATCH_DIR }}/v3014-lowercase-index-result.json
            ${{ env.SCRATCH_DIR }}/v3014-selectable-text-segmentation-result.json
            ${{ env.SCRATCH_DIR }}/v3014-ocr-search-result.json
            ${{ env.SCRATCH_DIR }}/v3014-raster-image-result.json
            ${{ env.SCRATCH_DIR }}/v3014-visual-candidate-result.json
            ${{ env.SCRATCH_DIR }}/v3014-visual-result.json
          if-no-files-found: error

  rust-parity-drift-pass:
    name: rust-parity-drift-pass/pass
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - map-and-stale
      - differential
    if: ${{ always() }}

    steps:
      - name: Evaluate rust-parity-drift-pass fan-in
        env:
          MAP_AND_STALE_RESULT: ${{ needs.map-and-stale.result }}
          DIFFERENTIAL_RESULT: ${{ needs.differential.result }}
        run: |
          set -euo pipefail
          failed=0
          if [ "$MAP_AND_STALE_RESULT" != "success" ]; then failed=1; fi
          if [ "$DIFFERENTIAL_RESULT" != "success" ]; then failed=1; fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::rust-parity-drift-pass failed — claimed-subset checks not green at candidate SHA"
            exit 1
          fi
