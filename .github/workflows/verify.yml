# Post-merge suite for optimistic merge: everything the merge-queue gate (ci.yml)
# leaves out runs here on each push to main, and on a pull request marked ready
# (ci.yml calls this file and scopes the lanes to changed paths). The `verified`
# job is the marker Release reads.
# Public repository: GitHub-hosted standard runners only (scripts/check-public-runner-profiles.py).
name: Verify

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  plan:
    name: Plan Verify lanes
    if: ${{ github.repository_visibility == 'public' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.paths.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Classify changed paths
        id: paths
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(mktemp)
          trap 'rm -f -- "$files"' EXIT
          # Check that GitHub's test merge covers this exact base and head.
          # Compare the tested tree to its base; a move counts at both paths.
          if [[ -z "$BASE" || -z "$HEAD" ]] ||
             ! parents=$(git show -s --format=%P HEAD) || [[ "$parents" != "$BASE $HEAD" ]] ||
             ! git diff --no-renames --ignore-submodules=none --name-only -z "$BASE" HEAD -- > "$files" ||
             [[ ! -s "$files" ]]; then
            echo 'scope=full' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          web=false native=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/workflows|.github/workflows/*|.github/actions|.github/actions/*)
                echo 'scope=full' >> "$GITHUB_OUTPUT"
                exit 0 ;;
              LICENSE|CHANGELOG.md|CONTRIBUTING.md|SECURITY.md|.github/ISSUE_TEMPLATE/*) ;;
              apps/web/*) web=true ;;
              # The web WASM build uses anymd-core, anymd-formats and anymd-pdf.
              # Keep their sources, manifests, and web copy inputs shared.
              crates/anymd/src/*.rs|crates/anymd-ocr-vlm/src/*.rs|packages/anymd/*|packages/aliases/*|packages/npm/*|packages/pypi/*|scripts/build-wheels.py|scripts/recover-wheels.py)
                native=true ;;
              *) web=true; native=true ;;
            esac
          done < "$files"

          case "$web/$native" in
            true/true) scope=mixed ;;
            true/false) scope=web ;;
            false/true) scope=native ;;
            false/false) scope=none ;;
          esac
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

  docs:
    name: Build and verify web
    needs: plan
    if: ${{ github.repository_visibility == 'public' && !cancelled() && needs.plan.outputs.scope != 'native' && needs.plan.outputs.scope != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            bun install
          else
            bun install --frozen-lockfile
          fi

      - name: Test web contracts on web-only changes
        if: ${{ needs.plan.outputs.scope == 'web' }}
        run: bun test test/docs-observability.test.ts test/vs-pages.test.ts test/web-cli-grant.test.ts test/web-commerce.test.ts

      - name: Set up Rust (WASM)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.100.0'
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: web-wasm

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: wasm-bindgen@0.2.130

      - name: Build standalone Next web app with WASM
        run: bun run web:wasm && bun run web:build

      - name: Check legacy redirects
        run: python3 scripts/test_pages_redirect.py

      - name: Install Chromium
        run: cd apps/web && bunx playwright install --with-deps chromium

      - name: Browser journeys (desktop and mobile; light and dark)
        run: bun run web:e2e

  audit:
    name: Audit Rust dependencies
    needs: plan
    if: ${{ github.repository_visibility == 'public' && !cancelled() && needs.plan.outputs.scope != 'web' && needs.plan.outputs.scope != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.100.0'

      # scripts/check-cargo-advisories.sh installs cargo-audit from source
      # when it is missing; keep the binary between runs.
      - name: Cache cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.23.0-${{ runner.os }}

      - name: Audit Rust dependencies
        run: bash scripts/check-cargo-advisories.sh

  # The Rust workspace: package, build, fixtures, tests and coverage.
  rust:
    name: Build and test
    needs: plan
    if: ${{ github.repository_visibility == 'public' && !cancelled() && needs.plan.outputs.scope != 'web' && needs.plan.outputs.scope != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            bun install
          else
            bun install --frozen-lockfile
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.100.0'
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy (all workspace targets, warnings denied)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Packages every publishable crate the way `cargo publish` does (builds each
      # from its packed sources against the others), then keeps each under the
      # crates.io limit of 10 MB.
      - name: Package the crates for crates.io
        run: |
          cargo package --locked -p anymd-oar-ocr-vl -p anymd-adobe-cmap-parser -p anymd-pdf-extract -p anymd-pdf -p anymd-formats -p anymd-core -p anymd-ocr-vlm -p anymd
          bash scripts/publish-crates.sh --list
          oversized=$(find target/package -name '*.crate' -size +9M)
          if [ -n "$oversized" ]; then echo "over 9 MB: $oversized" >&2; exit 1; fi
          ls -l target/package/*.crate

      - name: Build the anymd binary
        run: bun run build

      - name: Hosted real video core and MCP API fixtures
        env:
          ANYMD_BIN: ${{ github.workspace }}/target/release/anymd
          # A real anymd Pro licence for CI (issued for ci@sylphx.com); the fixture
          # also proves the release binary refuses Pro calls without one.
          ANYMD_PRO_TOKEN_CI: ${{ secrets.ANYMD_PRO_TOKEN_CI }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          cargo test --locked -p anymd-formats --test video_timeline -- --ignored
          python3 scripts/video_api_fixture.py

      - name: Verify portable ASR CPU configuration
        run: python3 scripts/check-native-cpu.py target/release/build

      - name: Test installed Python wheel and optional framework adapters
        run: |
          python3 scripts/build-wheels.py --version 0.0.0 --out "${RUNNER_TEMP}/python-wheels" \
            --binary "manylinux_2_17_x86_64=target/release/anymd"
          python3 -m venv "${RUNNER_TEMP}/anymd-python"
          "${RUNNER_TEMP}/anymd-python/bin/pip" install \
            "${RUNNER_TEMP}/python-wheels/anymd-0.0.0-py3-none-manylinux_2_17_x86_64.whl[langchain,llamaindex]"
          "${RUNNER_TEMP}/anymd-python/bin/python" -c \
            'from anymd import convert; assert "<!-- page 1 -->" in convert("test/fixtures/sample.pdf").text'
          ANYMD_BIN="$PWD/target/release/anymd" "${RUNNER_TEMP}/anymd-python/bin/python" \
            -m unittest discover -s packages/pypi/tests -v

      - name: Test Markdown corpus downloader
        run: python3 -I scripts/test_fetch_markdown_corpus.py

      - name: Fetch Markdown regression corpus
        run: bash scripts/fetch-markdown-corpus.sh "${RUNNER_TEMP}/markdown-corpus"

      - name: Rust core tests
        env:
          ANYMD_CORPUS_DIR: ${{ runner.temp }}/markdown-corpus
        run: bun run test:rust

      # The docs playground runs anymd-pdf + anymd-formats in the browser; keep
      # them free of native-only dependencies.
      - name: Check WebAssembly build
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --locked -p anymd-wasm --target wasm32-unknown-unknown

      - name: Run Tests and Check Coverage
        env:
          ANYMD_PRO_TOKEN: ${{ secrets.ANYMD_PRO_TOKEN_CI }}
        run: bun run test:cov

  # Run the OS matrix on the trunk, on manual runs, and when the PR needs
  # every lane. Missing plan output also selects every lane.
  other-os:
    needs: plan
    if: ${{ github.repository_visibility == 'public' && !cancelled() && !contains(fromJSON('["web","native","mixed","none"]'), needs.plan.outputs.scope) }}
    name: Test other OS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.100.0'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Rust workspace tests
        run: cargo test --locked --workspace --no-fail-fast

      - name: Build the anymd binary
        run: cargo build --release --locked -p anymd

      # The npm launcher (packages/anymd/bin/anymd.js) starts the native binary.
      - name: Launcher smoke test
        shell: bash
        run: |
          set -euo pipefail
          node packages/anymd/bin/anymd.js version
          node packages/anymd/bin/anymd.js test/fixtures/sample.pdf > sample.md
          grep -q '<!-- page 1 -->' sample.md

  # Validate builds Linux x64. Compile the actual product (not only the runtime
  # probe) on the other release targets, without downloading model weights.
  release-targets:
    name: Release build (${{ matrix.target }})
    needs: plan
    if: ${{ github.repository_visibility == 'public' && !cancelled() && needs.plan.outputs.scope != 'web' && needs.plan.outputs.scope != 'none' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-latest, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.100.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked -p anymd --target ${{ matrix.target }}
      - name: Verify portable ASR CPU configuration
        run: python3 scripts/check-native-cpu.py target/${{ matrix.target }}/release/build

  # The marker. Named exactly `verified`; never a required check.
  verified:
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    name: verified
    if: ${{ always() && github.repository_visibility == 'public' }}
    needs: [plan, docs, audit, rust, other-os, release-targets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/needs-pass@3778944553b3f1d2a017832d343c2f844a226725 # main
        with:
          needs: ${{ toJSON(needs) }}
          required: ${{ github.event_name == 'pull_request' && 'plan' || '' }}
