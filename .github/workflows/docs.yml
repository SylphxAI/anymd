# optimistic-merge: advisory
name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docs Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      # Must match the `wasm-bindgen` crate pinned in crates/anymd-wasm/Cargo.toml.
      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: wasm-bindgen@0.2.126

      - name: Install wasm-opt
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binaryen

      - name: Build playground WebAssembly
        run: bash scripts/build-wasm.sh

      - name: Build docs
        run: bun run docs:build

      - name: Verify playground assets
        run: test -s docs/.vitepress/dist/wasm/anymd_wasm_bg.wasm && test -s docs/.vitepress/dist/wasm/anymd_wasm.js

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
