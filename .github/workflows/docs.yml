# optimistic-merge: advisory — Publishes only legacy URL redirects; the web app is deployed by Sylphx.
name: Deploy Legacy Redirects

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build redirect-only artifact
    if: ${{ github.repository_visibility == 'public' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify the canonical web is serving before switching Pages
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://anymd.sylphx.com/api/health | jq -e '.status == "ok" and .service == "anymd-web"'
          for route in /pricing /recover /pro/thanks /guide/getting-started /studio /llms.txt; do
            curl --fail --silent --show-error "https://anymd.sylphx.com${route}" -o /dev/null
          done

      - name: Build redirects only
        run: python3 scripts/build-pages-redirect.py dist/pages

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/pages

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ github.repository_visibility == 'public' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
