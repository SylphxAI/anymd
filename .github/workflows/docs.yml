# optimistic-merge: advisory — Deploys GitHub Pages docs site; docs build verification runs in verify.yml.
name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docs Site
    if: ${{ github.repository_visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.100.0'
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Must match the `wasm-bindgen` crate pinned in crates/anymd-wasm/Cargo.toml.
      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: wasm-bindgen@0.2.130

      - name: Install wasm-opt
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binaryen

      - name: Build playground WebAssembly
        run: bash scripts/build-wasm.sh

      - name: Build docs
        env:
          ANYMD_OBS_PUBLISHABLE_KEY: ${{ vars.ANYMD_OBS_PUBLISHABLE_KEY }}
          ANYMD_OBS_CAPTURE_URL: ${{ vars.ANYMD_OBS_CAPTURE_URL }}
        run: bun run docs:build

      - name: Verify playground assets
        run: test -s docs/.vitepress/dist/wasm/anymd_wasm_bg.wasm && test -s docs/.vitepress/dist/wasm/anymd_wasm.js

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ github.repository_visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
