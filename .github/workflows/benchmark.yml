name: Benchmark

# AgentDocBench: every tool in bench/adapters/ converts the corpus on a
# GitHub-hosted runner (one job per tool, heavy tools sharded). Each job
# uploads its results JSON and Markdown outputs; the report job merges them
# and prints the leaderboard to the job summary. See bench/README.md.
on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'Comma-separated tools to run (empty = all)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Corpus and anymd
    if: ${{ github.repository_visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read benchmark matrix
        id: matrix
        run: echo "value=$(jq -c . bench/matrix.json)" >> "$GITHUB_OUTPUT"

      - name: Test benchmark harness (offline)
        run: python3 -m unittest discover -s bench -p 'test_*.py'

      - name: Cache corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: corpus
          key: agentdocbench-corpus-${{ hashFiles('bench/corpus.json') }}

      - name: Fetch and verify corpus
        run: python3 bench/fetch.py corpus

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.100.0'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build anymd
        run: cargo build --release -p anymd

      - uses: SylphxAI/.github/.github/actions/run-store@724d4c9c87e736ced2068bc22eb57385adabd14d # main
        with:
          mode: put
          name: corpus
          path: corpus/
          retention-days: 3

      - uses: SylphxAI/.github/.github/actions/run-store@724d4c9c87e736ced2068bc22eb57385adabd14d # main
        with:
          mode: put
          name: anymd-binary
          path: target/release/anymd
          retention-days: 3

  bench:
    name: ${{ matrix.tool }} ${{ matrix.shard }}
    needs: prepare
    if: ${{ github.repository_visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      TOOL: ${{ matrix.tool }}
      SHARD: ${{ matrix.shard }}
      TOOLS: ${{ github.event.inputs.tools }}
      HF_HOME: ${{ github.workspace }}/../model-cache/huggingface
      MODEL_CACHE_DIR: ${{ github.workspace }}/../model-cache/datalab
      TORCH_DEVICE: cpu
    steps:
      - name: Selected
        id: selected
        run: |
          if [ -z "$TOOLS" ] || [[ ",$TOOLS," == *",$TOOL,"* ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.selected.outputs.run == 'true'

      - uses: SylphxAI/.github/.github/actions/run-store@724d4c9c87e736ced2068bc22eb57385adabd14d # main
        if: steps.selected.outputs.run == 'true'
        with:
          mode: get
          name: corpus
          path: corpus

      - uses: SylphxAI/.github/.github/actions/run-store@724d4c9c87e736ced2068bc22eb57385adabd14d # main
        if: steps.selected.outputs.run == 'true'
        with:
          mode: get
          name: anymd-binary
          path: anymd-bin

      - name: System tools (poppler, tesseract with CJK, pandoc)
        if: steps.selected.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-chi-tra tesseract-ocr-chi-sim tesseract-ocr-jpn pandoc
          chmod +x anymd-bin/anymd
          echo "ANYMD_BIN=$PWD/anymd-bin/anymd" >> "$GITHUB_ENV"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.selected.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bench/requirements/*.txt

      - name: Model cache
        if: steps.selected.outputs.run == 'true' && contains('docling marker unstructured', matrix.tool)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/../model-cache
          key: agentdocbench-models-${{ matrix.tool }}-${{ hashFiles(format('bench/requirements/{0}.txt', matrix.tool)) }}

      - name: llama.cpp server for marker's OCR model
        if: steps.selected.outputs.run == 'true' && matrix.tool == 'marker'
        run: |
          curl --fail --location --retry 3 --silent --show-error -o llama.tgz \
            https://github.com/ggml-org/llama.cpp/releases/download/b11177/llama-b11177-bin-ubuntu-x64.tar.gz
          echo "9e088583293c4c104953ead0dd8957f4e00dca318c7f241c039198e5eb2e2e54  llama.tgz" | sha256sum --check
          tar -xzf llama.tgz -C "$RUNNER_TEMP"
          echo "LLAMA_CPP_BINARY=$RUNNER_TEMP/llama-b11177/llama-server" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/llama-b11177" >> "$GITHUB_ENV"

      - name: Install ${{ matrix.tool }}
        if: steps.selected.outputs.run == 'true'
        run: |
          pip install --quiet -r bench/requirements/harness.txt
          if [ -f "bench/requirements/$TOOL.txt" ]; then pip install --quiet -r "bench/requirements/$TOOL.txt"; fi

      - name: Run ${{ matrix.tool }} ${{ matrix.shard }}
        if: steps.selected.outputs.run == 'true'
        run: |
          name="$TOOL-${SHARD/\//of}"
          echo "NAME=$name" >> "$GITHUB_ENV"
          python bench/run.py --tool "$TOOL" --shard "$SHARD" --corpus corpus \
            --out "out/$name.json" --save-outputs "out/outputs/$TOOL"

      - uses: SylphxAI/.github/.github/actions/run-store@724d4c9c87e736ced2068bc22eb57385adabd14d # main
        if: always() && !cancelled() && steps.selected.outputs.run == 'true' && hashFiles('out/**') != ''
        with:
          mode: put
          name: results-${{ env.NAME }}
          path: out/
          retention-days: 3

  report:
    name: Leaderboard
    needs: [prepare, bench]
    if: ${{ github.repository_visibility == 'public' && (always() && !cancelled() && needs.prepare.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Select result names
        id: bundles
        env:
          TOOLS: ${{ inputs.tools }}
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          {
            echo 'names<<EOF'
            jq -r --arg tools "$TOOLS" '
              .[] | select(.tool as $tool | $tools == "" or ($tools | split(",") | index($tool)))
              | "results-\(.tool)-\(.shard | sub("/"; "of"))"
            ' <<< "$MATRIX"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/run-store-collect
        with:
          names: ${{ steps.bundles.outputs.names }}
          path: parts
          merge: 'true'

      - name: Merge shards and render
        env:
          TOOLS: ${{ github.event.inputs.tools }}
        run: |
          set -euo pipefail
          mkdir -p current-results
          selected=0
          for tool in anymd pdftotext markitdown kreuzberg docling marker unstructured; do
            if [ -n "$TOOLS" ] && [[ ",$TOOLS," != *",$tool,"* ]]; then continue; fi
            selected=$((selected + 1))
            python3 bench/merge.py "bench/results/$tool.json" parts/"$tool"-*.json
            cp "bench/results/$tool.json" "current-results/$tool.json"
          done
          [ "$selected" -gt 0 ] || { echo 'No supported benchmark tools selected' >&2; exit 1; }
          python3 bench/leaderboard.py --results current-results --print | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stage benchmark results and Markdown outputs
        run: |
          out="$RUNNER_TEMP/agentdocbench"
          mkdir -p "$out/bench" "$out/parts"
          cp -a bench/results "$out/bench/"
          if [ -d parts/outputs ]; then cp -a parts/outputs "$out/parts/"; fi

      - uses: SylphxAI/.github/.github/actions/run-store@724d4c9c87e736ced2068bc22eb57385adabd14d # main
        with:
          mode: put
          name: agentdocbench-results
          path: ${{ runner.temp }}/agentdocbench
          retention-days: 3
