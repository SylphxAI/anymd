name: Publish npm

# Admission-gated multi-platform native optional package + main package publish.
# dropInFor3014 remains false until sole-runtime registry proof.
# Authenticates with npm trusted publishing (GitHub OIDC): every published
# package trusts SylphxAI/anymd + this workflow filename (publish-npm.yml), so
# no long-lived npm token is needed. The publish job must stay on a
# GitHub-hosted runner; npm does not accept OIDC from self-hosted runners.
# Does not re-run the heavy changesets release matrix.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type I_UNDERSTAND_USER_IMPACT to publish (admission gate still enforced)'
        required: true
        default: ''
      use_token_fallback:
        description: 'Transitional: authenticate with the NPM_TOKEN secret instead of OIDC (only until every package has its trusted publisher)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  build-native:
    name: build-native (${{ matrix.platformId }})
    if: ${{ github.event.inputs.confirm == 'I_UNDERSTAND_USER_IMPACT' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platformId: linux-x64-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platformId: linux-arm64-gnu
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          # Product macOS: Sylphx self-hosted only (no GitHub-hosted macos-*).
          - platformId: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platformId: darwin-x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - platformId: win32-x64-msvc
            runner: ubuntu-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # cargo-zigbuild needs zig on PATH for portable linux glibc natives
      - uses: mlugg/setup-zig@v2
        if: ${{ matrix.platformId == 'linux-x64-gnu' || matrix.platformId == 'linux-arm64-gnu' }}
        with:
          version: 0.14.1
      - name: Build release server for ${{ matrix.platformId }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platformId }}" in
            linux-x64-gnu|linux-arm64-gnu)
              # Publish gate requires GLIBC <= 2.35. Host cargo on modern runners
              # can link newer glibc (e.g. 2.39). Use cargo-zigbuild for portable 2.17.
              cargo install cargo-zigbuild --version 0.23.0 --locked
              cargo zigbuild --release -p pdf-reader-mcp-server --target ${{ matrix.target }}.2.17
              ;;
            win32-x64-msvc)
              sudo apt-get update -y
              sudo apt-get install -y --no-install-recommends clang lld llvm
              if ! command -v clang-cl >/dev/null 2>&1; then
                sudo ln -sf "$(command -v clang)" /usr/local/bin/clang-cl
              fi
              if ! command -v lld-link >/dev/null 2>&1; then
                sudo ln -sf "$(command -v lld)" /usr/local/bin/lld-link
              fi
              if ! command -v llvm-lib >/dev/null 2>&1 && command -v llvm-ar >/dev/null 2>&1; then
                sudo ln -sf "$(command -v llvm-ar)" /usr/local/bin/llvm-lib
              fi
              cargo install cargo-xwin --locked --version '=0.18.4'
              cargo xwin build --release -p pdf-reader-mcp-server --target ${{ matrix.target }}
              ;;
            *)
              cargo build --release -p pdf-reader-mcp-server --target ${{ matrix.target }}
              ;;
          esac
          if [[ "${{ matrix.platformId }}" == "win32-x64-msvc" ]]; then
            src="target/${{ matrix.target }}/release/anymd.exe"
            dest="bin/native/${{ matrix.platformId }}/anymd.exe"
          else
            src="target/${{ matrix.target }}/release/anymd"
            dest="bin/native/${{ matrix.platformId }}/anymd"
          fi
          mkdir -p "$(dirname "$dest")"
          cp "$src" "$dest"
          if [[ "${{ matrix.platformId }}" != "win32-x64-msvc" ]]; then
            chmod +x "$dest"
          fi
          ls -la "$dest"
      - name: Upload staged native binary
        uses: actions/upload-artifact@v7
        with:
          name: anymd-native-${{ matrix.platformId }}
          path: bin/native/${{ matrix.platformId }}/**
          if-no-files-found: error

  publish:
    name: Publish natives + main + aliases
    needs: build-native
    if: ${{ github.event.inputs.confirm == 'I_UNDERSTAND_USER_IMPACT' }}
    # GitHub-hosted on purpose: npm trusted publishing and --provenance both
    # require a GitHub-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - name: Create release bot token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node
        # Node is the npm CLI / customer installer host, not the company TypeScript toolchain.
        uses: actions/setup-node@v7
        # No registry-url: that writes an npmrc bound to NODE_AUTH_TOKEN, and
        # publishing authenticates through OIDC instead.
        with:
          node-version: '22'

      - name: Upgrade npm for trusted publishing
        run: |
          set -euo pipefail
          # Trusted publishing (OIDC) needs npm >= 11.5.1 and Node >= 22.14.0.
          npm install -g npm@11
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm "+process.argv[1]+" < 11.5.1"); process.exit(1) }' "$(npm --version)"
          node -e 'const [a,b]=process.versions.node.split(".").map(Number); if (a<22||(a===22&&b<14)) { console.error("node "+process.versions.node+" < 22.14.0"); process.exit(1) }'
          echo "node $(node --version), npm $(npm --version)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enforce verified-candidate admission
        run: bun scripts/check-verified-candidate-admission.ts --require-exact-head

      - name: Download all native binaries
        uses: actions/download-artifact@v8
        with:
          path: native-artifacts
          pattern: anymd-native-*
          merge-multiple: false

      - name: Set up Rust (for package smoke only)
        uses: dtolnay/rust-toolchain@stable

      - name: Build TypeScript package and host rust for smoke
        run: |
          bun run build
          # Host build is for package:smoke only. It must NOT be what we publish.
          bun run build:rust
          bun run package:smoke

      - name: Stage multi-platform native binaries into packages (after host build)
        run: |
          set -euo pipefail
          # Critical: build:rust stages the publish-job host binary into
          # packages/anymd-<host>/bin and would overwrite the
          # Ubuntu 22.04 artifact with a newer-glibc binary. Restage all
          # matrix artifacts immediately before publish.
          bun run native:stage-from-artifacts -- --artifact-root=native-artifacts
          bun run native:sync-manifests
          bun run native:assert-ready -- --all
          bin="packages/anymd-linux-x64-gnu/bin/anymd"
          test -f "$bin"
          if command -v objdump >/dev/null 2>&1; then
            mapfile -t vers < <(objdump -T "$bin" | sed -n 's/.*GLIBC_\([0-9][0-9.]*\).*/\1/p' | sort -u)
            echo "GLIBC symbols: ${vers[*]}"
            for v in "${vers[@]}"; do
              major=${v%%.*}
              rest=${v#*.}
              minor=${rest%%.*}
              if [ "$major" -gt 2 ] || { [ "$major" -eq 2 ] && [ "${minor:-0}" -gt 35 ]; }; then
                echo "::error::linux-x64-gnu binary requires GLIBC_$v (> 2.35). Refusing publish."
                exit 1
              fi
            done
            echo "linux-x64-gnu GLIBC requirement OK (<= 2.35)"
          fi

      - name: Capture previous customer version
        run: |
          set -euo pipefail
          # The first anymd release has no previous @sylphx/anymd version; the
          # upgrade leg of the install proof is skipped then (the old names are
          # covered by the alias packages instead).
          PREVIOUS_VERSION="$(npm view @sylphx/anymd version 2>/dev/null || true)"
          echo "PREVIOUS_VERSION=$PREVIOUS_VERSION" >> "$GITHUB_ENV"

      - name: Publish natives, then main, then aliases
        env:
          USE_TOKEN_FALLBACK: ${{ inputs.use_token_fallback && 'true' || 'false' }}
          NPM_TOKEN: ${{ inputs.use_token_fallback && secrets.NPM_TOKEN || '' }}
        run: |
          set -euo pipefail
          if [ "$USE_TOKEN_FALLBACK" = "true" ]; then
            if [ -z "${NPM_TOKEN:-}" ]; then
              echo "::error::use_token_fallback=true but the NPM_TOKEN secret is absent; publish through OIDC instead" >&2
              exit 1
            fi
            echo "::warning::publishing with the transitional NPM_TOKEN fallback, not trusted publishing"
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          else
            # npm exchanges the job's GitHub OIDC token for a short-lived,
            # per-package publish token. No npmrc credential is written.
            echo "publishing through npm trusted publishing (GitHub OIDC)"
          fi
          bun run release:publish-with-natives

      - name: Clear npm deprecation on the former names
        env:
          NPM_TOKEN: ${{ inputs.use_token_fallback && secrets.NPM_TOKEN || '' }}
        run: |
          set -uo pipefail
          # @sylphx/citra and @sylphx/pdf-reader-mcp are live aliases of
          # @sylphx/anymd, so any old "retired" deprecation must stay cleared.
          # OIDC authenticates only npm publish, not npm deprecate, so this runs
          # only on the token fallback; otherwise it checks and reports.
          # Non-fatal either way: the packages are already published.
          for name in @sylphx/pdf-reader-mcp @sylphx/citra; do
            notice="$(npm view "$name" deprecated 2>/dev/null || true)"
            if [ -z "$notice" ]; then
              echo "${name}: no deprecation notice"
              continue
            fi
            if [ -n "${NPM_TOKEN:-}" ]; then
              printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
              if npm deprecate "${name}@*" ""; then
                echo "cleared deprecation on ${name}"
                continue
              fi
            fi
            echo "::warning::${name} is still deprecated; an owner clears it with: npm deprecate \"${name}@*\" \"\""
          done

      - name: Registry readback (main + host optional)
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          # npm root packuments for brand-new package names can lag after successful publish.
          # Prefer versioned package documents + longer retries; do not red a job whose
          # packages already landed (see 5.0.0 publish run that published then failed view).
          packument_ok() {
            local name="$1" ver="$2"
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              return 0
            fi
            local enc
            enc=$(node -p "encodeURIComponent(process.argv[1])" "$name")
            local code
            code=$(curl -sS -o /tmp/npm-packument.json -w '%{http_code}' "https://registry.npmjs.org/$enc/$ver" || true)
            [ "$code" = "200" ]
          }
          ok=0
          for i in $(seq 1 72); do
            if packument_ok "@sylphx/anymd" "$VERSION" && packument_ok "@sylphx/anymd-linux-x64-gnu" "$VERSION"; then
              ok=1
              break
            fi
            echo "readback wait $i for @sylphx/anymd@$VERSION (+ linux-x64-gnu native)"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            # A successful npm publish can precede CDN/readback visibility by
            # several minutes. The main package is the release contract; when it
            # is live but a native package readback still lags, do not red the
            # release. The five-platform native install proof remains a
            # dedicated matrix and the next scheduled readback confirms it.
            if npm view "@sylphx/anymd@$VERSION" version >/dev/null 2>&1; then
              echo "::warning::@sylphx/anymd@$VERSION is live; native readback lagged after 6 minutes; install proof deferred"
              exit 0
            fi
            echo "::error::@sylphx/anymd@$VERSION did not appear in the registry after publish" >&2
            exit 1
          fi
          npm view "@sylphx/anymd@$VERSION" version bin optionalDependencies || true
          npm view "@sylphx/anymd-linux-x64-gnu@$VERSION" version || true
          for alias in @sylphx/citra @sylphx/pdf-reader-mcp; do
            if packument_ok "$alias" "$VERSION"; then
              npm view "$alias@$VERSION" version bin dependencies || true
            else
              echo "::warning::alias $alias@$VERSION readback lagged; check it with npm view"
            fi
          done
          # Install proof is the stronger oracle than raw npm view for this job host.
          FROM_ARGS=()
          if [ -n "${PREVIOUS_VERSION:-}" ]; then
            FROM_ARGS=(--from-version="$PREVIOUS_VERSION")
          fi
          bun run check:registry-install-proof -- \
            --registry \
            "${FROM_ARGS[@]}" \
            --version="$VERSION"
          # Host-only registry proof in this job; full five-platform pure-Rust initialize remains a dedicated matrix.

      - name: Create source-bound GitHub release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            tag_sha="$(git rev-list -n 1 "$TAG")"
            test "$tag_sha" = "$GITHUB_SHA"
            echo "GitHub release $TAG already binds $GITHUB_SHA"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes --title "$TAG"
          fi
