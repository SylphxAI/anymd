name: Navigation regression

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base commit or branch to compare against (defaults to origin/main)'
        required: false
        default: 'origin/main'

permissions:
  contents: read

jobs:
  regression:
    name: Default read and AgentDocBench parity
    if: ${{ github.repository_visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_ref || 'origin/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: '1.100.0'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build changed binary
        run: |
          cargo build --release --locked -p anymd
          cp target/release/anymd "${RUNNER_TEMP}/anymd-new"
      - name: Build base binary on the same runner
        run: |
          mkdir "${RUNNER_TEMP}/anymd-base"
          git archive "$BASE_SHA" | tar -x -C "${RUNNER_TEMP}/anymd-base"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --release --locked -p anymd --manifest-path "${RUNNER_TEMP}/anymd-base/Cargo.toml"
          cp target/release/anymd "${RUNNER_TEMP}/anymd-before"
      - name: Fetch pinned AgentDocBench corpus
        run: python3 bench/fetch.py "${RUNNER_TEMP}/navigation-corpus"
      - name: Check default output byte parity on every benchmark document
        run: |
          python3 scripts/check-navigation-regression.py --before "${RUNNER_TEMP}/anymd-before" --after "${RUNNER_TEMP}/anymd-new" --corpus "${RUNNER_TEMP}/navigation-corpus" --report "${RUNNER_TEMP}/navigation-parity.json"
      - name: Read back a real corpus PDF outline
        run: |
          "${RUNNER_TEMP}/anymd-new" outline "${RUNNER_TEMP}/navigation-corpus/fed-h8.pdf" > "${RUNNER_TEMP}/outline-example.txt"
          "${RUNNER_TEMP}/anymd-new" outline "${RUNNER_TEMP}/navigation-corpus/fed-h8.pdf" --format json > "${RUNNER_TEMP}/outline-example.json"
      - name: Stage available navigation evidence
        id: evidence
        if: always() && !cancelled()
        run: |
          mkdir -p "$RUNNER_TEMP/navigation-evidence"
          for name in anymd-new navigation-parity.json outline-example.txt outline-example.json; do
            if [ -f "$RUNNER_TEMP/$name" ]; then
              cp "$RUNNER_TEMP/$name" "$RUNNER_TEMP/navigation-evidence/"
              echo 'present=true' >> "$GITHUB_OUTPUT"
            fi
          done
      - uses: SylphxAI/.github/.github/actions/run-store@724d4c9c87e736ced2068bc22eb57385adabd14d # main
        if: always() && !cancelled() && steps.evidence.outputs.present == 'true'
        with:
          mode: put
          name: navigation-evidence
          path: ${{ runner.temp }}/navigation-evidence
          retention-days: 3
