name: Plugin source scan

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Plugin source scan
    if: ${{ github.repository_visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scan source without executing plugin commands
        uses: hashgraph-online/ai-plugin-scanner-action@013b123a036a252a6d74ddb52836ee923498150c # v1.2.817
        with:
          plugin_dir: .
          mode: scan
          format: json
          output: plugin-scan-report.json
          min_score: '80'
          fail_on_severity: high
          trust_repository_policy: 'false'
          online: 'false'
          upload_sarif: 'false'
          pr_comment: off
      - name: Preserve rule-level findings
        if: always() && !cancelled() && hashFiles('plugin-scan-report.json') != ''
        uses: SylphxAI/.github/.github/actions/run-store@724d4c9c87e736ced2068bc22eb57385adabd14d # main
        with:
          mode: put
          name: plugin-source-scan
          path: plugin-scan-report.json
          retention-days: 1
