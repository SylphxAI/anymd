name: Publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 3.2.2). Defaults to package.json version.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish MCP Registry metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout admission policy
        uses: actions/checkout@v7
        with:
          # The verified-candidate admission check resolves the reviewed SHA and
          # diffs it against HEAD, so it needs full history. A shallow clone made
          # it report the pinned candidate as unreachable and refuse to publish.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Setup Node
        # The version check reads the registry with `npm view`, so this job
        # needs the npm CLI on PATH. Without it the check fails with
        # "npm: command not found" before publishing anything.
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enforce verified-candidate admission
        run: bun scripts/check-verified-candidate-admission.ts --require-exact-head

      - name: Install pinned mcp-publisher
        run: |
          set -euo pipefail
          PUBLISHER_VERSION='v1.8.1'
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)
              ASSET='mcp-publisher_linux_amd64.tar.gz'
              SHA256='a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc'
              ;;
            Linux-aarch64|Linux-arm64)
              ASSET='mcp-publisher_linux_arm64.tar.gz'
              SHA256='8dd75a6cf6845688b5d4e46df58d3ca26d5c8d233bb0626606e1db82c5e883e4'
              ;;
            *)
              echo "Unsupported publisher host: $(uname -s)-$(uname -m)" >&2
              exit 1
              ;;
          esac
          ARCHIVE="$RUNNER_TEMP/$ASSET"
          curl --proto '=https' --tlsv1.2 -fsSLo "$ARCHIVE" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/${ASSET}"
          echo "$SHA256  $ARCHIVE" | sha256sum -c -
          tar -xzf "$ARCHIVE" mcp-publisher

      - name: Verify source and npm versions
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            if [[ -z "$VERSION" ]]; then
              VERSION="$(jq -r .version package.json)"
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          test "$(jq -r .version package.json)" = "$VERSION"
          test "$(jq -r .version server.json)" = "$VERSION"
          test "$(jq -r '.packages[0].version' server.json)" = "$VERSION"
          test "$(jq -r '.packages[0].identifier' server.json)" = '@sylphx/anymd'
          test "$(npm view "@sylphx/anymd@$VERSION" version)" = "$VERSION"
          while IFS= read -r package_name; do
            test "$(npm view "${package_name}@${VERSION}" version)" = "$VERSION"
          done < <(jq -r '.optionalDependencies | keys[]' package.json)
          echo "Publishing source-bound MCP Registry metadata for version=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Check canonical registry state
        id: canonical-state
        run: |
          set -euo pipefail
          URL='https://registry.modelcontextprotocol.io/v0.1/servers/io.github.SylphxAI%2Fanymd/versions/latest'
          WEBSITE="$(jq -r '.websiteUrl' server.json)"
          REPO="$(jq -r '.repository.url' server.json)"
          if curl -fsS "$URL" > "$RUNNER_TEMP/anymd-before.json" && \
            jq -e --arg version "$VERSION" \
              '.server.name == "io.github.SylphxAI/anymd" and .server.version == $version and .server.packages[0].identifier == "@sylphx/anymd" and .server.packages[0].version == $version' \
              "$RUNNER_TEMP/anymd-before.json" >/dev/null; then
            STATUS="$(jq -r '._meta["io.modelcontextprotocol.registry/official"].status' "$RUNNER_TEMP/anymd-before.json")"
            # Not just "is it there" - does it still describe the same server?
            # A rename changes repository.url and websiteUrl without changing
            # the version, so existence alone hides stale metadata.
            if jq -e --arg website "$WEBSITE" --arg repo "$REPO" \
              '.server.websiteUrl == $website and .server.repository.url == $repo' \
              "$RUNNER_TEMP/anymd-before.json" >/dev/null; then
              MATCHES=true
            else
              MATCHES=false
            fi
            {
              echo 'exists=true'
              echo "status=$STATUS"
              echo "matches=$MATCHES"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo 'exists=false'
              echo 'status=missing'
              echo 'matches=false'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Restore canonical active status
        if: ${{ steps.canonical-state.outputs.exists == 'true' && steps.canonical-state.outputs.status != 'active' }}
        run: |
          set -euo pipefail
          # The publisher answers 400 "status and message are already set to the
          # provided values" when the desired state is already in place. That is
          # success for this step, not a failure.
          if ! out=$(./mcp-publisher status --status active io.github.SylphxAI/anymd "$VERSION" 2>&1); then
            if grep -qE 'already set to the provided values|No changes to apply' <<<"$out"; then
              echo "Canonical status already active; nothing to restore"
            else
              echo "$out" >&2
              exit 1
            fi
          fi

      - name: Publish or edit the MCP Registry record
        run: |
          set -euo pipefail
          TOKEN_FILE="$HOME/.config/mcp-publisher/token.json"
          test -f "$TOKEN_FILE" || { echo "missing $TOKEN_FILE; did the login step run?" >&2; exit 1; }
          TOKEN="$(jq -r '.token' "$TOKEN_FILE")"
          REGISTRY="$(jq -r '.registry' "$TOKEN_FILE")"
          case "$REGISTRY" in */) ;; *) REGISTRY="$REGISTRY/" ;; esac
          NAME='io.github.SylphxAI/anymd'
          ESCAPED_NAME="$(node -p "encodeURIComponent(process.argv[1])" "$NAME")"

          if [ "${{ steps.canonical-state.outputs.exists }}" != 'true' ]; then
            ./mcp-publisher publish
            exit 0
          fi
          if [ "${{ steps.canonical-state.outputs.matches }}" = 'true' ]; then
            echo "Registry record already matches server.json; nothing to publish"
            exit 0
          fi

          # The version exists but describes the server differently. Two
          # registry rules apply here and they look contradictory until you
          # separate the axes:
          #
          #   POST /v0/publish        - create only per version
          #                             ("cannot publish duplicate version")
          #   PUT  /v0/servers/{n}/versions/{v}
          #                         - "Edit MCP server: Update the configuration
          #                            of a specific version of an existing MCP
          #                            server" (requires edit permission)
          #
          # A repository rename is exactly the edit case: the released version
          # is unchanged, but its published pointers went stale. Creating a new
          # version just to correct a link would misreport the release.
          #
          # Known limitation: `edit` is not grantable through github-oidc. That
          # auth mints `publish` for the repository owner's namespace and
          # nothing else (internal/api/handlers/v0/auth/github_oidc.go,
          # buildPermissions), so this PUT answers 403 "You do not have edit
          # permissions for this server" for us. If that happens, the drifted
          # version is frozen as published: report it and stop rather than
          # pretend it was corrected. A release is the only path to corrected
          # pointers.
          echo "Registry record drifted; editing $NAME@$VERSION in place"
          if ! out=$(curl -sS -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @server.json \
            "${REGISTRY}v0/servers/${ESCAPED_NAME}/versions/${VERSION}" 2>&1); then
            echo "$out" >&2
            echo "Cannot edit $NAME@$VERSION in place: this registry grants edit only to admins," >&2
            echo "and github-oidc mints publish only. Cut a release to carry corrected pointers." >&2
            exit 1
          fi
          echo "$out"

      - name: Read back canonical anymd identity
        run: |
          set -euo pipefail
          URL='https://registry.modelcontextprotocol.io/v0.1/servers/io.github.SylphxAI%2Fanymd/versions/latest'
          for attempt in $(seq 1 36); do
            if curl -fsS "$URL" > "$RUNNER_TEMP/anymd-registry.json" && \
              jq -e --arg version "$VERSION" \
                --arg website "$(jq -r '.websiteUrl' server.json)" \
              --arg repo "$(jq -r '.repository.url' server.json)" \
              '.server.name == "io.github.SylphxAI/anymd" and .server.version == $version and .server.packages[0].identifier == "@sylphx/anymd" and .server.packages[0].version == $version and .server.websiteUrl == $website and .server.repository.url == $repo and ._meta["io.modelcontextprotocol.registry/official"].status == "active"' \
                "$RUNNER_TEMP/anymd-registry.json" >/dev/null; then
              cat "$RUNNER_TEMP/anymd-registry.json"
              exit 0
            fi
            echo "MCP Registry readback wait $attempt for anymd $VERSION"
            sleep 5
          done
          echo "Canonical anymd registry readback failed" >&2
          exit 1

      - name: Deprecate retired MCP Registry identities
        run: |
          set -euo pipefail
          # Both pre-anymd registry names point readers at the canonical one.
          # The npm packages @sylphx/citra and @sylphx/pdf-reader-mcp stay live
          # as thin aliases; only the registry listings retire.
          # `--all-versions` is a bulk operation, so the publisher asks
          # "Continue? [y/N]" before writing. CI has no stdin, so `--yes` skips
          # the prompt. Idempotent: a re-run on an already-deprecated identity
          # answers 400 "No changes to apply", which is success here.
          for retired in io.github.SylphxAI/citra io.github.SylphxAI/pdf-reader-mcp; do
            if ! out=$(./mcp-publisher status \
                --status deprecated \
                --all-versions \
                --yes \
                --message 'Renamed to anymd. Use io.github.SylphxAI/anymd (npm @sylphx/anymd).' \
                "$retired" 2>&1); then
              if grep -qE 'already set to the provided values|No changes to apply' <<<"$out"; then
                echo "$retired already deprecated; nothing to do"
              else
                echo "$out" >&2
                exit 1
              fi
            fi
            ESCAPED="$(node -p "encodeURIComponent(process.argv[1])" "$retired")"
            URL="https://registry.modelcontextprotocol.io/v0.1/servers/${ESCAPED}/versions/latest"
            ok=false
            for attempt in $(seq 1 24); do
              if curl -fsS "$URL" > "$RUNNER_TEMP/retired-registry.json" && \
                jq -e '._meta["io.modelcontextprotocol.registry/official"].status == "deprecated"' \
                  "$RUNNER_TEMP/retired-registry.json" >/dev/null; then
                cat "$RUNNER_TEMP/retired-registry.json"
                ok=true
                break
              fi
              echo "MCP Registry deprecation readback wait $attempt for $retired"
              sleep 5
            done
            if [ "$ok" != true ]; then
              echo "Retired registry identity $retired deprecation readback failed" >&2
              exit 1
            fi
          done
