name: Money catalogue

on:
  push:
    branches: [main]
    paths:
      - 'config/money-catalogue.json'
      - 'scripts/money-catalogue-apply.sh'
  pull_request:
    paths:
      - 'config/money-catalogue.json'
      - 'scripts/money-catalogue-apply.sh'
      - 'scripts/money-catalogue-apply.test.ts'
      - '.github/workflows/money-catalogue.yml'
      - 'scripts/money-access-verify.py'
      - 'scripts/money-access-verify.test.py'
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify Access grants without changing the catalogue
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: money-catalogue
  cancel-in-progress: false

jobs:
  test:
    name: Offline contract tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: bun test scripts/money-catalogue-apply.test.ts

      - run: python3 scripts/money-access-verify.test.py

  preview:
    name: Apply to preview
    needs: test
    if: github.event_name != 'pull_request' && inputs.verify_only != true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACCESS_NAME: anymd-money-catalogue-preview
      SYNC_FAILURE_NONFATAL: '1'
      STRIPE_TEST_RESTRICTED_KEY: ${{ secrets.STRIPE_TEST_RESTRICTED_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/money-catalogue-apply.sh

  production:
    name: Apply to production
    needs: preview
    if: github.event_name != 'pull_request' && inputs.verify_only != true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACCESS_NAME: anymd-money-catalogue-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/money-catalogue-apply.sh

  verify:
    name: Verify Access (${{ matrix.declaration }})
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.verify_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - declaration: anymd-money-catalogue-preview
            environment: orgs/org_fs01afbdccgn8xdk1ghj5y47w0vtph/projects/prj_fs013ejakyn22t4bsvrvyj0f2x1pgq/envs/env_fs01ta34sv4z5b861a83ftmaxexp92
            other_environment: orgs/org_fs01afbdccgn8xdk1ghj5y47w0vtph/projects/prj_fs013ejakyn22t4bsvrvyj0f2x1pgq/envs/env_fs01p2f389mwmm2xsm1nmvcst69vgd
            scopes: billing:read,billing:write,billing:licence_keys.approve
          - declaration: anymd-money-catalogue-production
            environment: orgs/org_fs01afbdccgn8xdk1ghj5y47w0vtph/projects/prj_fs013ejakyn22t4bsvrvyj0f2x1pgq/envs/env_fs01p2f389mwmm2xsm1nmvcst69vgd
            other_environment: orgs/org_fs01afbdccgn8xdk1ghj5y47w0vtph/projects/prj_fs013ejakyn22t4bsvrvyj0f2x1pgq/envs/env_fs01ta34sv4z5b861a83ftmaxexp92
            scopes: billing:read,billing:write,billing:licence_keys.approve
    env:
      ACCESS_NAME: ${{ matrix.declaration }}
      EXPECTED_ENVIRONMENT: ${{ matrix.environment }}
      OTHER_ENVIRONMENT: ${{ matrix.other_environment }}
      EXPECTED_SCOPES: ${{ matrix.scopes }}
      EXPECTED_REF: refs/heads/main
      OTHER_REPOSITORY_DECLARATION: lockdocs-money-catalogue-preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/money-access-verify.py
