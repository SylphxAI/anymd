name: OmniDocBench

# anymd on OmniDocBench v1.6 (https://github.com/opendatalab/OmniDocBench), scored by the official
# end2end evaluator at a pinned commit. Page images go through `anymd --ocr` (the image and OCR path).
# The dataset ships no source PDFs, so there is no PDF-variant run. See bench/omnidocbench/README.md.
on:
  workflow_dispatch:
    inputs:
      ocr:
        description: 'Local OCR engine (vlm or tesseract)'
        type: choice
        options: [vlm, tesseract]
        default: vlm
      limit:
        description: 'Score only the first N pages by file name (0 = all 1651 pages; use a small N for a smoke test)'
        required: false
        default: '0'
      predictions_run:
        description: 'Reuse predictions from a completed run instead of converting pages again (same engine and limit required)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: omnidocbench-${{ github.ref }}
  cancel-in-progress: true

env:
  # opendatalab/OmniDocBench, "Codebase Update to v1.6" era: README updated to v1.6 (2026-04-10)
  EVALUATOR_COMMIT: 147cd5ac9472002f5751221d390bf00abdbc0d2f
  LIMIT: ${{ github.event.inputs.limit || '0' }}
  ANYMD_OCR: ${{ github.event.inputs.ocr || 'vlm' }}

jobs:
  build:
    if: inputs.predictions_run == ''
    name: Build anymd
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 bench/omnidocbench/test_harness.py
      - run: cargo build --release -p anymd
      - uses: actions/upload-artifact@v7
        with:
          name: anymd-binary
          path: target/release/anymd
          retention-days: 7

  predict:
    name: Pages ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [1/32, 2/32, 3/32, 4/32, 5/32, 6/32, 7/32, 8/32, 9/32, 10/32, 11/32, 12/32, 13/32, 14/32, 15/32, 16/32, 17/32, 18/32, 19/32, 20/32, 21/32, 22/32, 23/32, 24/32, 25/32, 26/32, 27/32, 28/32, 29/32, 30/32, 31/32, 32/32]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: anymd-binary
          path: anymd-bin

      - name: Tesseract (English, Chinese, Japanese packs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-tra tesseract-ocr-chi-sim tesseract-ocr-jpn
          tesseract --version | head -1
          tesseract --list-langs
          chmod +x anymd-bin/anymd
          echo "ANYMD_BIN=$PWD/anymd-bin/anymd" >> "$GITHUB_ENV"

      - name: Install pinned doc-VLM weights
        if: env.ANYMD_OCR == 'vlm'
        run: anymd-bin/anymd setup ocr

      - name: Run anymd on the page images
        env:
          # Four pages run at once on four cores; tesseract's own OpenMP threads on top of that
          # oversubscribe the runner until pages exceed the 60 s OCR timeout and come back empty.
          OMP_THREAD_LIMIT: '1'
        run: |
          python3 bench/omnidocbench/harness.py predict --shard "${{ matrix.shard }}" \
            --limit "$LIMIT" --workers 1 --timeout 620 --out "pred/${{ strategy.job-index }}"

      - uses: actions/upload-artifact@v7
        with:
          name: predictions-${{ strategy.job-index }}
          path: pred/
          retention-days: 7

  evaluate:
    name: Official evaluator
    needs: predict
    if: always() && !cancelled() && (needs.predict.result == 'success' || inputs.predictions_run != '')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - name: Validate prediction run
        env:
          PREDICTIONS_RUN: ${{ inputs.predictions_run }}
        run: |
          if [[ -n "$PREDICTIONS_RUN" && ! "$PREDICTIONS_RUN" =~ ^[0-9]+$ ]]; then
            echo 'predictions_run must be a numeric workflow run id'; exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.predictions_run || github.run_id }}
          pattern: predictions-*
          path: pred-parts
          merge-multiple: true

      - name: Collect predictions
        run: |
          mkdir -p predictions
          find pred-parts -name '*.md' -exec mv -t predictions {} +
          echo "predictions: $(ls predictions | wc -l)"

      - name: Ground truth
        run: python3 bench/omnidocbench/harness.py gt --limit "$LIMIT" --out gt.json

      - name: Verify prediction coverage
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          ground_truth = json.loads(Path('gt.json').read_text())
          expected = {p['page_info']['image_path'][:-4] + '.md' for p in ground_truth}
          actual = {p.name for p in Path('predictions').glob('*.md')}
          if actual != expected:
              raise SystemExit(f'Prediction coverage mismatch: {len(expected-actual)} missing, {len(actual-expected)} extra')
          print(f'Prediction coverage: {len(actual)}/{len(expected)} pages')
          PYTHON

      - uses: actions/checkout@v7
        with:
          repository: opendatalab/OmniDocBench
          ref: ${{ env.EVALUATOR_COMMIT }}
          path: evaluator

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: CDM system dependencies (LaTeX with CJK, Ghostscript, ImageMagick)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ghostscript imagemagick texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended texlive-science latex-cjk-common latex-cjk-chinese texlive-lang-chinese fonts-arphic-gkai00mp
          # The evaluator calls `magick` (ImageMagick 7); Ubuntu ships ImageMagick 6, whose `convert` takes the same arguments.
          printf '#!/bin/sh\nexec convert "$@"\n' | sudo tee /usr/local/bin/magick >/dev/null
          sudo chmod +x /usr/local/bin/magick
          # Ubuntu's ImageMagick policy blocks PDF; CDM renders LaTeX through PDF.
          sudo sed -i 's|<policy domain="coder" rights="none" pattern="PDF" />|<policy domain="coder" rights="read\|write" pattern="PDF" />|' /etc/ImageMagick-6/policy.xml
          pdflatex --version | head -1
          convert --version | head -1
          gs --version
          kpsewhich CJK.sty c70gkai.fd || echo 'warning: CJK LaTeX files missing; Chinese formulas will not render in CDM'

      - name: Install the evaluator
        working-directory: evaluator
        run: pip install --quiet -e .

      - name: Score (official end2end config, quick_match)
        working-directory: evaluator
        run: |
          # configs/end2end.yaml unchanged except the two data paths and the worker counts (this runner has 4 cores).
          sed -i \
            -e "s|./demo_data/omnidocbench_demo/OmniDocBench_demo.json|$GITHUB_WORKSPACE/gt.json|" \
            -e "s|./demo_data/end2end|$GITHUB_WORKSPACE/predictions|" \
            -e 's|cdm_workers: 13|cdm_workers: 2|; s|teds_workers: 13|teds_workers: 2|; s|match_workers: 13|match_workers: 2|' \
            configs/end2end.yaml
          git diff --stat configs/end2end.yaml
          python pdf_validation.py --config configs/end2end.yaml
          ls result

      - name: Headline scores
        run: |
          {
            echo "### anymd on OmniDocBench v1.6 (image pages, \`anymd --ocr\`, limit=$LIMIT)"
            echo "Prediction source run: ${{ inputs.predictions_run || github.run_id }}; OCR engine: $ANYMD_OCR"
            echo '```json'
            python3 bench/omnidocbench/summarize.py evaluator/result/predictions_quick_match_metric_result.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: omnidocbench-results
          path: |
            evaluator/result/
            evaluator/configs/end2end.yaml
            pred-parts/**/timings-*.json
          retention-days: 90
