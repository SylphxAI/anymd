name: Doc-VLM release targets

on:
  push:
    branches: [feat/docvlm-ocr]
  pull_request:
    paths: [crates/anymd-ocr-vlm/**, crates/anymd/src/ocr_vlm*, Cargo.lock, .github/workflows/docvlm.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docvlm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Generate the pinned synthetic corpus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-liberation
          pip install pillow==12.1.1 numpy==2.4.2
          python3 crates/anymd-ocr-vlm/bench/make_pages.py pages
      - uses: actions/upload-artifact@v7
        with:
          name: docvlm-pages
          path: pages
          retention-days: 7
  targets:
    name: Candle on ${{ matrix.target }}
    needs: pages
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests and release binary
        shell: bash
        run: |
          cargo test --locked -p anymd-oar-ocr-vl -p anymd-ocr-vlm -p anymd
          cargo build --release --locked -p anymd --target "${{ matrix.target }}"
          cargo check --locked -p anymd --no-default-features
      - name: Plain CLI still runs on pre-FP16 ARM hardware
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          qemu-aarch64 -cpu cortex-a72 target/aarch64-unknown-linux-gnu/release/anymd version
          qemu-aarch64 -cpu cortex-a72 target/aarch64-unknown-linux-gnu/release/anymd test/fixtures/sample.pdf --no-ocr > sample.md
          grep -q '<!-- page 1 -->' sample.md
          if qemu-aarch64 -cpu cortex-a72 target/aarch64-unknown-linux-gnu/release/anymd __ocr-vlm-worker missing.png 1 2> hardware-error.txt; then
            echo 'Expected the FP16 hardware guard to reject the old CPU'; exit 1
          fi
          grep -q 'FP16-capable' hardware-error.txt
      - uses: actions/upload-artifact@v7
        with:
          name: anymd-docvlm-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/anymd
            target/${{ matrix.target }}/release/anymd.exe
          retention-days: 7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: docvlm-pages
          path: pages
      - name: Install and measure the production OCR worker
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[measure]')
        shell: bash
        env:
          ANYMD_CACHE_DIR: ${{ runner.temp }}/anymd-cache
          RAYON_NUM_THREADS: '4'
        run: |
          binary="target/${{ matrix.target }}/release/anymd"
          if [[ "${{ runner.os }}" == "Windows" ]]; then binary="$binary.exe"; fi
          "$binary" setup ocr
          pip install psutil==7.0.0
          for mode in none q8 q4; do
            ANYMD_OCR_QUANTIZATION="$mode" python crates/anymd-ocr-vlm/bench/measure.py --binary "$binary" --pages pages --out "measure-$mode.json"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docvlm-measure-${{ matrix.target }}
          path: measure-*.json
          if-no-files-found: ignore
          retention-days: 30
