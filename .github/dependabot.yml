# .github/dependabot.yml
version: 2
updates:
  # Rust workspace dependencies
  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    ignore:
      # ureq 3 replaced the 2.x `tls` feature with `rustls`, so a major bump
      # cannot resolve while crates/anymd, crates/anymd-core and
      # crates/anymd-formats ask for `tls`; that unresolved dependency fails the
      # whole cargo update job. Migrate those three manifests to ureq 3, then
      # drop this rule.
      - dependency-name: 'ureq'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(rust)'
      include: 'scope'
    rebase-strategy: 'auto'

  # Dependency updates for the root package.json, locked by bun.lock. The
  # `npm_and_yarn` updater cannot read bun.lock, so these are the `bun` updater's.
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore(dev)'
      include: 'scope'
    rebase-strategy: 'auto'

  # GitHub Actions updates
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5 # Limit for actions
    commit-message:
      prefix: 'chore(actions)'
      include: 'scope'
    rebase-strategy: 'auto'
