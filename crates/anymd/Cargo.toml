[package]
name = "anymd"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true
description = "anymd: any file to clean Markdown for AI agents. Pure-Rust MCP server + CLI binary for @sylphx/anymd"
homepage.workspace = true
authors.workspace = true
readme.workspace = true
include = ["src/**/*", "Cargo.toml"]
keywords = ["mcp", "pdf", "rmcp", "agent"]
categories = ["command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "anymd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
command-group = { version = "5", features = ["with-tokio"] }
anymd-core = { workspace = true }
anymd-formats = { workspace = true }
ignore = "0.4"
url = "2"
rmcp = { version = "3.1.2", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
# Shared MCP setup, CLI hints and cache-root policy.
sylphx-mcp-kit = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
# `json` for the region-analysis HTTP provider; `rustls` and `gzip` as before
# (see anymd-core).
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
