[package]
name = "anymd"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
description = "anymd: any file to clean Markdown for AI agents. Pure-Rust MCP server + CLI binary for @sylphx/anymd"
authors.workspace = true
readme.workspace = true
include = ["src/**/*", "Cargo.toml", "tests/worker_lifecycle.rs", "tests/worker_lifecycle.py"]
keywords = ["mcp", "pdf", "rmcp", "agent"]
categories = ["command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "anymd"
path = "src/main.rs"

[[bin]]
name = "anymd-ocr-vlm"
path = "src/bin/anymd-ocr-vlm.rs"
required-features = ["ocr-vlm"]

# The default build leaves the in-process VLM engine (candle, ~6 MB) out; VLM
# OCR runs in the `anymd-ocr-vlm` companion that `anymd setup ocr` installs.
# `--features ocr-vlm` builds the engine in, and builds the companion.
[features]
default = []
ocr-vlm = ["anymd-ocr-vlm/candle"]

[package.metadata.cargo-machete]
# `mcp_kit` is the package's library name; the grep is name-blind.
ignored = ["sylphx-mcp-kit"]

[dependencies]
hex = "0.4.3"
anymd-ocr-vlm = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp", "webp"] }
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
ed25519-dalek = "3.0.0"
command-group = { version = "5.0.1", features = ["with-tokio"] }
anymd-core = { workspace = true }
anymd-formats = { workspace = true }
ignore = "0.4.34"
url = "2.5.8"
rmcp = { version = "3.11.0", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = { version = "1.2.3", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
# Shared MCP setup, CLI hints and cache-root policy. The macros call the
# package as `mcp_kit`, so only `cargo-machete` cannot see the use.
sylphx-mcp-kit = { version = "0.8.11", features = ["licence"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
# `json` for the region-analysis HTTP provider; `rustls` and `gzip` as before
# (see anymd-core).
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "gzip", "json"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

# Model-free lifecycle regressions run only on isolated CI runners.
[[test]]
name = "worker_lifecycle"
path = "tests/worker_lifecycle.rs"
harness = false
