[package]
name = "anymd-formats"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
include = ["src/**/*", "tests/fixtures/aligner/*.json", "Cargo.toml"]
description = "Non-PDF format converters for anymd: DOCX, PPTX, XLSX, CSV, EPUB, HTML, images, and video to Markdown"
keywords = ["markdown", "docx", "xlsx", "epub", "mcp"]
categories = ["parsing", "text-processing"]

[lib]
path = "src/lib.rs"

[package.metadata.cargo-machete]
# `mcp_kit::cache` in src/cache.rs (the library name differs from the
# package), and the exif crate is imported as `exif`.
ignored = ["sylphx-mcp-kit", "kamadak-exif"]

[dependencies]
hex = "0.4.3"
sylphx-mcp-kit = { version = "0.8.18", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
calamine = { version = "0.38.0", features = ["dates"] }
csv = "1.4.0"
scraper = "0.29.0"
ego-tree = "0.11.1"
url = "2.5.8"
imagesize = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
kamadak-exif = "0.6.2"
tempfile = { version = "3.27.0", optional = true }
wait-timeout = { version = "0.2.1", optional = true }
# SHA-256 pinned ASR model downloader. `rustls` and `gzip`, the features ureq 2 was
# built with here (see anymd-core).
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "gzip"], optional = true }
sha2 = { version = "0.11.1", optional = true }

transcribe-cpp = { version = "=0.4.2", default-features = false, optional = true }
hound = { version = "3.5.1", optional = true }

[features]
# Local helper binaries (tesseract OCR, ffprobe/ffmpeg, bundled transcribe-cpp) and the
# opt-in Qwen3 model download. Off for WebAssembly: images then report
# metadata only and media the sniffed container.
default = ["native"]
native = ["dep:tempfile", "dep:wait-timeout", "dep:ureq", "dep:sha2", "dep:transcribe-cpp", "dep:hound"]

[dev-dependencies]
tempfile = "3.27.0"
rust_xlsxwriter = { version = "0.102.0", default-features = false }
