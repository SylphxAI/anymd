[package]
name = "pdf-reader-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust MCP server binary for @sylphx/citra"
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["mcp", "pdf", "rmcp", "agent"]
categories = ["command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "citra-mcp-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
command-group = { version = "5", features = ["with-tokio"] }
pdf-reader-core = { path = "../pdf-reader-core", version = "3.1.1" }
anymd-formats = { path = "../anymd-formats", version = "3.1.1" }
ignore = "0.4"
url = "2"
rmcp = { version = "3.1.2", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
ureq = { version = "2.12", default-features = true, features = ["tls", "json"] }
