[package]
name = "anymd-wasm"
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "anymd in the browser: any file to clean Markdown via WebAssembly (docs playground)"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# No native features: no sockets or helper binaries in the browser.
anymd-core = { path = "../anymd-core", default-features = false, features = ["formats"] }
serde_json = "1.0.154"
# Pinned to the wasm-bindgen CLI that generates the JS bindings (CI installs the same).
wasm-bindgen = "=0.2.130"
