  <!-- headline -->
  <text x="96" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="750" letter-spacing="-2" fill="#eaf2dd">Give your AI agent eyes</text>
