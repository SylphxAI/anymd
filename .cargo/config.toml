# gemm-common's AArch64 FP16 inline assembly lacks target-feature annotations.
# Candle's FP16 kernels require these instructions; check them at runtime before
# VLM inference. The non-VLM CLI path is tested on an emulated Cortex-A72 in CI.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+fp16"]

# Published binaries must not inherit the CI host's CPU instruction set.
# transcribe-cpp-sys 0.2.4 forwards these defines to its bundled CMake build.
[env]
TRANSCRIBE_CMAKE_ARGS = { value = "-DGGML_NATIVE=OFF -DTRANSCRIBE_X86_CONSERVATIVE=ON", force = true }
