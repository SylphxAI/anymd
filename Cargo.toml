[workspace]
members = [
    "crates/anymd-core",
    "crates/anymd",
    "crates/anymd-formats",
    "crates/anymd-pdf",
    "crates/anymd-wasm",
    "vendor/adobe-cmap-parser",
    "vendor/pdf-extract",
]
resolver = "2"

[workspace.package]
version = "8.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SylphxAI/anymd"
homepage = "https://github.com/SylphxAI/anymd"
authors = ["Sylphx <contact@sylphx.com>"]
readme = "README.md"

# Production binaries: smaller artifacts without requiring runtime downloads.
# Keep debuginfo available via separate tooling/dSYM workflows in CI when needed.

# pdf-extract depends on adobe-cmap-parser 0.4.1, which panics on malformed
# CMap destinations (see SylphxAI/anymd#608). Vendor a patched copy
# so arbitrary PDFs can never abort the server from a CMap parse panic.
[patch.crates-io]
adobe-cmap-parser = { path = "vendor/adobe-cmap-parser" }
# pdf-extract 0.12.1 runs Form XObjects with an identity CTM (figure text lands
# at the wrong place) and parses image XObjects as content streams. Vendored
# with a fix so figures stay where they are drawn, and so every path-painting
# operator (f*, B, b, s) reaches the output device (table rules).
pdf-extract = { path = "vendor/pdf-extract" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# The browser build (crates/anymd-wasm): smallest download over peak speed.
# `cargo build -p anymd-wasm --profile wasm-release --target wasm32-unknown-unknown`
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"

[profile.release-with-debug]
inherits = "release"
strip = "none"
debug = true

