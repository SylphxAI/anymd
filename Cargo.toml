[workspace]
members = [
    "crates/anymd-core",
    "crates/anymd",
    "crates/anymd-ocr-vlm",
    "crates/anymd-formats",
    "crates/anymd-pdf",
    "crates/anymd-wasm",
    "vendor/adobe-cmap-parser",
    "vendor/pdf-extract",
    "vendor/oar-ocr-vl",
]
resolver = "2"

[workspace.package]
version = "8.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SylphxAI/anymd"
homepage = "https://github.com/SylphxAI/anymd"
authors = ["Sylphx <contact@sylphx.com>"]
readme = "README.md"

# Production binaries: smaller artifacts without requiring runtime downloads.
# Keep debuginfo available via separate tooling/dSYM workflows in CI when needed.

# Internal crates and the two patched upstream forks, pinned once. `version`
# next to `path` is what crates.io needs; `bun scripts/set-version.ts` moves the
# anymd-core/formats/pdf pins with the workspace version.
#
# pdf-extract 0.12.1 runs Form XObjects with an identity CTM (figure text lands
# at the wrong place), parses image XObjects as content streams, and does not
# send every path-painting operator (f*, B, b, s) to the output device (table
# rules). adobe-cmap-parser 0.4.1 panics on malformed CMap destinations (see
# SylphxAI/anymd#608). crates.io has no patched releases, so both live in
# vendor/ and are published as the forks anymd-pdf-extract and
# anymd-adobe-cmap-parser. The `package` rename keeps the library names
# (`pdf_extract`), so no source changes.
[workspace.dependencies]
oar-ocr-vl = { package = "anymd-oar-ocr-vl", path = "vendor/oar-ocr-vl", version = "0.9.2" }
anymd-ocr-vlm = { path = "crates/anymd-ocr-vlm", version = "8.3.0" }
anymd-core = { path = "crates/anymd-core", version = "8.3.0" }
anymd-formats = { path = "crates/anymd-formats", version = "8.3.0" }
anymd-pdf = { path = "crates/anymd-pdf", version = "8.3.0" }
pdf-extract = { package = "anymd-pdf-extract", path = "vendor/pdf-extract", version = "0.12.2" }
adobe-cmap-parser = { package = "anymd-adobe-cmap-parser", path = "vendor/adobe-cmap-parser", version = "0.4.1" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# The browser build (crates/anymd-wasm): smallest download over peak speed.
# `cargo build -p anymd-wasm --profile wasm-release --target wasm32-unknown-unknown`
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"

[profile.release-with-debug]
inherits = "release"
strip = "none"
debug = true

