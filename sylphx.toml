version = "1"

[project]
# Existing Platform project gold-gnat-rn7xc3.
name = "anymd"
default_env = "production"

[build]
strategy = "dockerfile"
dockerfile = "Dockerfile"
context = "."

# Auth's organization, publishable key and server secret come from the
# environment's Auth binding. Attach the Money key via a Platform Secret Binding
# on the intended environment, not a repository-defined secret mapping.
[environments.production.env.ANYMD_MONEY_MODE]
value = "live"

[[services]]
name = "web"
type = "web"
port = 3000
instance_type = "micro"
path_prefixes = ["/", "/api/health", "/api/auth", "/api/anymd"]
watch_paths = ["apps/web/**", "docs/**", "crates/**", "vendor/**", "config/money-catalogue.json", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "scripts/build-wasm.sh", "scripts/render-web-money.py", "bun.lock", "package.json", "Dockerfile", ".dockerignore", "sylphx.toml"]

[services.build]
strategy = "dockerfile"
dockerfile = "Dockerfile"
context = "."

[services.health]
mode = "http"
path = "/api/health"

[[domains]]
hostname = "anymd.sylphx.com"
service = "web"

[ci]
merge = "optimistic"
on_red = "revert"
